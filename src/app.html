<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Apply the saved theme before first paint to avoid a flash. Storage may be blocked.
			try {
				const t = JSON.parse(localStorage.getItem('lernwerkstatt:v1') ?? '{}')?.settings?.theme;
				if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
			} catch {}
			// Same for a collapsed side panel (see lib/sidebar.ts).
			try {
				if (localStorage.getItem('lernwerkstatt:sidebar') === 'closed') document.documentElement.dataset.sidebar = 'closed';
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
