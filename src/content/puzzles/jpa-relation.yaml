- id: rel-seminar-participants-join-table
  mindest: true
  kind: template
  title: Seminar und Teilnehmer – Zwischentabelle
  prompt: |
    Ein Seminar hat viele Teilnehmer, ein Teilnehmer besucht viele Seminare. Die Zwischentabelle heißt `seminar_participants` mit den Spalten `seminar_id` und `participant_id`. Dieselbe Person darf nicht zweimal im selben Seminar sein.
  uml: |
    hide empty methods
    class Seminar <<(E) Entity>> {
      - title : String {nn}
      - participants : Participant[*]
    }
    class Participant <<(E) Entity>> {
      - name : String {nn}
    }
    Seminar "n" -right-> "n" Participant
  given: |
    @Entity
    @Table(name = "participants")
    @Getter
    @Setter
    @NoArgsConstructor(access = AccessLevel.PROTECTED)
    @AllArgsConstructor
    public class Participant extends AbstractPersistable<Long> {

        @NotNull
        private String name;
    }
  template: |
    @Entity
    @Table(name = "seminars")
    @Getter
    @Setter
    @NoArgsConstructor(access = AccessLevel.PROTECTED)
    public class Seminar extends AbstractPersistable<Long> {

        @NotNull
        private String title;

        @{{ManyToMany}}
        @JoinTable(name = "{{seminar_participants}}",
                joinColumns = @JoinColumn(name = "{{seminar_id}}"),
                inverseJoinColumns = @JoinColumn(name = "{{participant_id}}"))
        private {{Set<Participant>}} participants = {{new HashSet<>()}};

        public Seminar(String title) {
            this.title = title;
        }

        // getParticipants(), addParticipant(...), removeParticipant(...)
    }
  redHerrings: [OneToMany, "List<Participant>", "new ArrayList<>()", participants_id, seminars_participants]
  explanation: |
    `joinColumns` zeigt auf die **eigene** Klasse (`seminar_id`), `inverseJoinColumns` auf die andere (`participant_id`). Mit einem `Set` wird das Paar zum Primary Key der Zwischentabelle – dieselbe Person kann nicht zweimal drinstehen. Mit `List` gäbe es keinen Primary Key.

- id: rel-participant-inverse-side
  kind: lines
  title: Teilnehmer – die Gegenseite
  prompt: |
    Jetzt soll auch der Teilnehmer seine Seminare kennen. Schreib `Participant` für die Tabelle `participants`: Annotationen, Felder, fachlicher Konstruktor, dann der Getter der Menge.
  uml: |
    hide empty methods
    class Seminar <<(E) Entity>> {
      - title : String {nn}
      - participants : Participant[*]
    }
    class Participant <<(E) Entity>> {
      - name : String {nn}
      - seminars : Seminar[*]
    }
    Seminar "n" -right- "n" Participant
  given: |
    @Entity
    @Table(name = "seminars")
    @Getter
    @Setter
    @NoArgsConstructor(access = AccessLevel.PROTECTED)
    public class Seminar extends AbstractPersistable<Long> {

        @NotNull
        private String title;

        @ManyToMany
        @JoinTable(name = "seminar_participants",
                joinColumns = @JoinColumn(name = "seminar_id"),
                inverseJoinColumns = @JoinColumn(name = "participant_id"))
        private Set<Participant> participants = new HashSet<>();

        public Seminar(String title) {
            this.title = title;
        }
    }
  solution: |
    @Entity
    @Table(name = "participants")
    @Getter
    @Setter
    @NoArgsConstructor(access = AccessLevel.PROTECTED)
    public class Participant extends AbstractPersistable<Long> {
        @NotNull
        private String name;
        @ManyToMany(mappedBy = "participants")
        private Set<Seminar> seminars = new HashSet<>();
        public Participant(String name) {
            this.name = name;
        }
        public Set<Seminar> getSeminars() {
            return Collections.unmodifiableSet(seminars);
        }
    }
  redHerrings:
    - "@AllArgsConstructor"
    - "    @ManyToMany(mappedBy = \"seminars\")"
    - "    @JoinTable(name = \"seminar_participants\")"
  explanation: |
    Die Gegenseite bekommt `mappedBy` mit dem **Feldnamen** der besitzenden Seite: `participants` in `Seminar`. Eine zweite `@JoinTable` wäre eine zweite, unabhängige Beziehung. Mit der Menge hat `Participant` jetzt eine Beziehung – also kein `@AllArgsConstructor` mehr, sondern ein eigener Konstruktor und ein unveränderlicher Getter.

- id: rel-seminar-helpers
  kind: lines
  title: Seminar – Hilfsmethoden für n:m
  prompt: |
    Schreib in `Seminar` den Getter der Menge, dann `addParticipant` und `removeParticipant`. Zuerst die eigene Menge ändern, dann die Gegenseite über die Methoden, die `Participant` dafür anbietet.
  given: |
    @Entity
    @Table(name = "seminars")
    @Getter
    @Setter
    @NoArgsConstructor(access = AccessLevel.PROTECTED)
    public class Seminar extends AbstractPersistable<Long> {

        @NotNull
        private String title;

        @ManyToMany
        @JoinTable(name = "seminar_participants",
                joinColumns = @JoinColumn(name = "seminar_id"),
                inverseJoinColumns = @JoinColumn(name = "participant_id"))
        private Set<Participant> participants = new HashSet<>();

        public Seminar(String title) {
            this.title = title;
        }

        // ✎ Getter und Hilfsmethoden
    }

    @Entity
    @Table(name = "participants")
    @Getter
    @Setter
    @NoArgsConstructor(access = AccessLevel.PROTECTED)
    public class Participant extends AbstractPersistable<Long> {

        @NotNull
        private String name;

        @ManyToMany(mappedBy = "participants")
        private Set<Seminar> seminars = new HashSet<>();

        public Participant(String name) {
            this.name = name;
        }

        public Set<Seminar> getSeminars() {
            return Collections.unmodifiableSet(seminars);
        }

        // package-private: nur Seminar ruft sie auf
        void addSeminarInternal(Seminar seminar) {
            seminars.add(seminar);
        }

        void removeSeminarInternal(Seminar seminar) {
            seminars.remove(seminar);
        }
    }
  solution: |
    public Set<Participant> getParticipants() {
        return Collections.unmodifiableSet(participants);
    }
    public void addParticipant(Participant participant) {
        participants.add(participant);
        participant.addSeminarInternal(this);
    }
    public void removeParticipant(Participant participant) {
        participants.remove(participant);
        participant.removeSeminarInternal(this);
    }
  redHerrings:
    - "    participant.getSeminars().add(this);"
    - "    return participants;"
    - "    participants.add(this);"
  explanation: |
    `participant.getSeminars().add(this)` sieht richtig aus, wirft aber eine `UnsupportedOperationException`: Der Getter gibt eine unveränderliche Sicht heraus. Deshalb bietet `Participant` package-private Methoden an, die nur `Seminar` aufruft. Gespeichert wird nur, was in `participants` steht – der besitzenden Seite.

- id: rel-student-locker-one-to-one
  kind: template
  title: Schüler und Spind – 1:1
  prompt: |
    Jeder Schüler hat höchstens einen Spind, und jeder Spind gehört höchstens einem Schüler. Der Fremdschlüssel `locker_id` liegt in `students`, der Constraint heißt `fk_students_locker`.
  uml: |
    hide empty methods
    class Student <<(E) Entity>> {
      - name : String {nn}
    }
    class Locker <<(E) Entity>> {
      - number : String {nn, unique}
    }
    Student "0,1" -right-> "0,1" Locker
  given: |
    @Entity
    @Table(name = "lockers")
    @Getter
    @Setter
    @NoArgsConstructor(access = AccessLevel.PROTECTED)
    @AllArgsConstructor
    public class Locker extends AbstractPersistable<Long> {

        @NotNull
        @Column(unique = true)
        private String number;
    }
  template: |
    @Entity
    @Table(name = "students")
    @Getter
    @Setter
    @NoArgsConstructor(access = AccessLevel.PROTECTED)
    public class Student extends AbstractPersistable<Long> {

        @NotNull
        private String name;

        @{{OneToOne}}
        @JoinColumn(name = "{{locker_id}}", foreignKey = @ForeignKey(name = "{{fk_students_locker}}"))
        private Locker locker;

        public Student(String name) {
            this.name = name;
        }
    }
  redHerrings: [ManyToOne, OneToMany, student_id, fk_lockers_student]
  explanation: |
    `@OneToOne` mit `@JoinColumn` sieht aus wie `@ManyToOne` – Hibernate legt die Spalte `locker_id` aber zusätzlich als `unique` an. So kann derselbe Spind nicht zwei Schülern gehören. Mit `@ManyToOne` fehlte diese Regel.

- id: rel-locker-student-both-sides
  kind: template
  title: Spind kennt Schüler – beide Seiten setzen
  prompt: |
    Jetzt kennt auch der Spind seinen Schüler. Ergänze die Gegenseite und den Setter in `Student`, der beide Seiten setzt.
  template: |
    @Entity
    @Table(name = "lockers")
    @Getter
    @Setter
    @NoArgsConstructor(access = AccessLevel.PROTECTED)
    public class Locker extends AbstractPersistable<Long> {

        @NotNull
        @Column(unique = true)
        private String number;

        @OneToOne(mappedBy = "{{locker}}")
        private Student student;

        public Locker(String number) {
            this.number = number;
        }
    }

    @Entity
    @Table(name = "students")
    @Getter
    @Setter
    @NoArgsConstructor(access = AccessLevel.PROTECTED)
    public class Student extends AbstractPersistable<Long> {

        @NotNull
        private String name;

        @OneToOne
        @JoinColumn(name = "locker_id")
        private Locker locker;

        public Student(String name) {
            this.name = name;
        }

        // selbst geschrieben: Lombok erzeugt dann kein eigenes setLocker
        public void setLocker(Locker locker) {
            this.locker = {{locker}};
            locker.{{setStudent}}({{this}});
        }
    }
  redHerrings: [student, lockers, setLocker, "null", "getStudent"]
  explanation: |
    `mappedBy = "locker"` nennt das Feld in `Student`, das den Fremdschlüssel besitzt. Der eigene `setLocker` setzt beide Seiten, damit `locker.getStudent()` sofort stimmt und nicht erst nach dem nächsten Lesen. Schreibst du eine Methode selbst, erzeugt Lombok sie nicht – `setStudent` in `Locker` kommt weiter von `@Setter`.

- id: rel-article-keywords
  kind: template
  title: Artikel – Schlagwörter als Collection
  prompt: |
    Ein Artikel hat eine Menge von Schlagwörtern (einfache Strings, höchstens 30 Zeichen). Sie kommen in die Tabelle `article_keywords` mit den Spalten `article_id` und `keyword`.
  uml: |
    hide empty methods
    class Article <<(E) Entity>> {
      - title : String {nn}
      - keywords : Set<String>
    }
  template: |
    @Entity
    @Table(name = "articles")
    @Getter
    @Setter
    @NoArgsConstructor(access = AccessLevel.PROTECTED)
    public class Article extends AbstractPersistable<Long> {

        @NotNull
        private String title;

        @{{ElementCollection}}
        @{{CollectionTable}}(name = "article_keywords", joinColumns = @JoinColumn(name = "{{article_id}}"))
        @Column(name = "keyword", length = 30)
        private Set<{{String}}> keywords = new HashSet<>();

        public Article(String title) {
            this.title = title;
        }

        public Set<String> getKeywords() {
            return Collections.unmodifiableSet(keywords);
        }
    }
  redHerrings: [OneToMany, JoinTable, keyword_id, Keyword, ManyToMany]
  explanation: |
    Schlagwörter sind keine Entities, sondern einfache Werte: `@ElementCollection` statt `@OneToMany`. `@CollectionTable` benennt die Tabelle und die Spalte, die auf den Artikel zeigt; `@Column` die Spalte für den Wert. Auch eine Collection zählt als Beziehung: kein `@AllArgsConstructor`.

- id: rel-ward-shifts-embeddable
  kind: template
  title: Station – Dienste als Value Objects
  prompt: |
    Eine Krankenhausstation hat eine Liste von Diensten. Ein Dienst (Wochentag, Beginn, Ende) ist ein Value Object ohne eigene Id. Die Dienste kommen in die Tabelle `ward_shifts`.
  uml: |
    hide empty methods
    class Ward <<(E) Entity>> {
      - name : String {nn}
      - shifts : Shift[*]
    }
    class Shift <<(V) ValueObject>> {
      - weekday : DayOfWeek
      - starts : Time
      - ends : Time
    }
    Ward *-right- "*" Shift
  template: |
    @{{Embeddable}}
    public record Shift(@Enumerated(EnumType.STRING) DayOfWeek weekday, LocalTime starts, LocalTime ends) {
    }

    @Entity
    @Table(name = "wards")
    @Getter
    @Setter
    @NoArgsConstructor(access = AccessLevel.PROTECTED)
    public class Ward extends AbstractPersistable<Long> {

        @NotNull
        private String name;

        @{{ElementCollection}}
        @CollectionTable(name = "ward_shifts", joinColumns = @JoinColumn(name = "ward_id"))
        private List<{{Shift}}> shifts = new ArrayList<>();

        public Ward(String name) {
            this.name = name;
        }
    }
  redHerrings: [Entity, OneToMany, Embedded, LocalDate]
  explanation: |
    Ein Value Object ist `@Embeddable` – ein Record passt, weil es unveränderlich ist. Eine **Liste** von Value Objects braucht `@ElementCollection` (eine einzelne Adresse wäre `@Embedded`). Jede Zeile in `ward_shifts` hat `ward_id`, `weekday`, `starts` und `ends`.

- id: rel-song-owning-side
  kind: lines
  title: Song – die besitzende Seite komplett
  prompt: |
    Schreib das ganze Entity `Song` für die Tabelle `songs`: Felder in der Reihenfolge des Diagramms, dann die Beziehung zum Album mit der Spalte `album_id` und dem Constraint `fk_songs_album`, zuletzt der fachliche Konstruktor.
  uml: |
    hide empty methods
    class Song <<(E) Entity>> {
      - title : String {nn}
      - seconds : int {nn}
    }
    class Album <<(E) Entity>> {
      - title : String {nn}
      - songs : Song[*]
    }
    Album "1" -right- "n" Song
  given: |
    @Entity
    @Table(name = "albums")
    @Getter
    @Setter
    @NoArgsConstructor(access = AccessLevel.PROTECTED)
    public class Album extends AbstractPersistable<Long> {

        @NotNull
        private String title;

        @OneToMany(mappedBy = "album")
        private List<Song> songs = new ArrayList<>();

        public Album(String title) {
            this.title = title;
        }
    }
  solution: |
    @Entity
    @Table(name = "songs")
    @Getter
    @Setter
    @NoArgsConstructor(access = AccessLevel.PROTECTED)
    public class Song extends AbstractPersistable<Long> {
        @NotNull
        private String title;
        private int seconds;
        @ManyToOne
        @JoinColumn(name = "album_id", nullable = false, foreignKey = @ForeignKey(name = "fk_songs_album"))
        private Album album;
        public Song(String title, int seconds) {
            this.title = title;
            this.seconds = seconds;
        }
    }
  redHerrings:
    - "@AllArgsConstructor"
    - "    @OneToMany(mappedBy = \"songs\")"
    - "    public Song(String title, int seconds, Album album) {"
  explanation: |
    `Song` besitzt die Beziehung: `@ManyToOne` mit `@JoinColumn`. Jeder Song gehört zu genau einem Album (`"1"`), also `nullable = false`. Mit der Beziehung gibt es kein `@AllArgsConstructor`; der fachliche Konstruktor nimmt nur `title` und `seconds`, das Album setzt `album.addSong(song)`.
