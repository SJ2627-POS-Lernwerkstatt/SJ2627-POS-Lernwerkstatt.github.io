# Puzzles "Beziehungen". Format: src/lib/content/schema.ts (puzzle).
# Convention (JPA unit 3): entities with a relation get @Getter @Setter @NoArgsConstructor(access = PROTECTED),
# no @AllArgsConstructor, a hand-written constructor with the attributes only, and own unmodifiable list getters.
# Verify: node scripts/verify-puzzles.ts jpa-relation

- id: rel-player-team-fk
  mindest: true
  kind: template
  title: Spieler und Team – der Fremdschlüssel
  prompt: |
    Jeder Spieler gehört zu genau einem Team, das Team kennt seine Spieler nicht. Die Fremdschlüssel-Spalte heißt `team_id`, der Constraint `fk_players_team`.
  uml: |
    hide empty methods
    class Player <<(E) Entity>> {
      - name : String {nn}
    }
    class Team <<(E) Entity>> {
      - name : String {nn}
    }
    Player "n" -right-> "1" Team
  given: |
    @Entity
    @Table(name = "teams")
    @Getter
    @Setter
    @NoArgsConstructor(access = AccessLevel.PROTECTED)
    @AllArgsConstructor
    public class Team extends AbstractPersistable<Long> {

        @NotNull
        private String name;
    }
  template: |
    @Entity
    @Table(name = "players")
    @Getter
    @Setter
    @NoArgsConstructor(access = AccessLevel.PROTECTED)
    public class Player extends AbstractPersistable<Long> {

        @NotNull
        private String name;

        @{{ManyToOne}}
        @JoinColumn(name = "{{team_id}}", {{nullable = false}},
                foreignKey = @ForeignKey(name = "{{fk_players_team}}"))
        private {{Team}} team;

        public Player(String name) {
            this.name = name;
        }
    }
  redHerrings: [OneToMany, "nullable = true", "List<Team>", player_id, fk_teams_player]
  explanation: |
    Viele Spieler gehören zu einem Team: `@ManyToOne` auf der „viele“-Seite. Die Multiplizität `"1"` heißt Pflicht, also `nullable = false`. `@ForeignKey(name = …)` ersetzt den generierten Constraint-Namen durch einen sprechenden. `team` ist eine Beziehung und deshalb nicht im fachlichen Konstruktor.

- id: rel-vehicle-constructor
  mindest: true
  kind: lines
  title: Fahrzeug – Entity mit Beziehung
  prompt: |
    Schreib das Entity `Vehicle` für die Tabelle `vehicles` mit der Beziehung zur Werkstatt. Felder in der Reihenfolge des Diagramms, die Beziehung zuletzt, dann der fachliche Konstruktor.
  uml: |
    hide empty methods
    class Vehicle <<(E) Entity>> {
      - plate : String {nn}
      - mileage : int
    }
    class Garage <<(E) Entity>> {
      - name : String {nn}
    }
    Vehicle "n" -right-> "0,1" Garage
  given: |
    @Entity
    @Table(name = "garages")
    @Getter
    @Setter
    @NoArgsConstructor(access = AccessLevel.PROTECTED)
    @AllArgsConstructor
    public class Garage extends AbstractPersistable<Long> {

        @NotNull
        private String name;
    }
  solution: |
    @Entity
    @Table(name = "vehicles")
    @Getter
    @Setter
    @NoArgsConstructor(access = AccessLevel.PROTECTED)
    public class Vehicle extends AbstractPersistable<Long> {
        @NotNull
        private String plate;
        private Integer mileage;
        @ManyToOne
        private Garage garage;
        public Vehicle(String plate, Integer mileage) {
            this.plate = plate;
            this.mileage = mileage;
        }
    }
  redHerrings:
    - "@AllArgsConstructor"
    - "    public Vehicle(String plate, Integer mileage, Garage garage) {"
    - "        this.garage = garage;"
  explanation: |
    Mit einer Beziehung gibt es kein `@AllArgsConstructor` – er würde `garage` als Parameter aufnehmen. Der fachliche Konstruktor nimmt nur die Attribute, so wie ihn die Tests aufrufen: `new Vehicle("W-123AB", 42000)`. Die Werkstatt setzt du danach mit `vehicle.setGarage(garage)` (von `@Setter`). `"0,1"` heißt: Die Werkstatt darf fehlen, also kein `nullable = false`.

- id: rel-truck-driver-cascade
  kind: template
  title: LKW und Fahrer – Cascade
  prompt: |
    Ein LKW hat genau einen Fahrer. Ein neuer, noch nicht gespeicherter Fahrer soll beim Speichern des LKWs **mitgespeichert** werden. Gelöscht wird nichts mit.
  given: |
    @Entity
    @Table(name = "drivers")
    @Getter
    @Setter
    @NoArgsConstructor(access = AccessLevel.PROTECTED)
    @AllArgsConstructor
    public class Driver extends AbstractPersistable<Long> {

        @NotNull
        private String name;
    }
  template: |
    @Entity
    @Table(name = "trucks")
    @Getter
    @Setter
    @NoArgsConstructor(access = AccessLevel.PROTECTED)
    public class Truck extends AbstractPersistable<Long> {

        @NotNull
        private String plate;

        @{{ManyToOne}}({{cascade}} = CascadeType.{{PERSIST}})
        @JoinColumn(name = "driver_id", nullable = false)
        private Driver driver;

        public Truck(String plate) {
            this.plate = plate;
        }
    }
  redHerrings: [ALL, REMOVE, fetch, OneToOne, orphanRemoval]
  explanation: |
    `CascadeType.PERSIST` gibt nur das Speichern weiter – so machen es die Musterlösungen. `ALL` würde auch das Löschen weitergeben: Ein gelöschter LKW nähme seinen Fahrer mit, obwohl der vielleicht noch andere LKWs fährt. Ohne Cascade scheitert der Flush mit `TransientPropertyValueException`.

- id: rel-album-songs-mapped-by
  mindest: true
  kind: template
  title: Album und Songs – beide Seiten
  prompt: |
    Album und Song kennen einander. Der Fremdschlüssel `album_id` liegt in der Tabelle `songs`; es darf **keine** Zwischentabelle entstehen.
  uml: |
    hide empty methods
    class Album <<(E) Entity>> {
      - title : String {nn}
      - songs : Song[*]
    }
    class Song <<(E) Entity>> {
      - title : String {nn}
      - album : Album
    }
    Album "1" -right- "n" Song
  template: |
    @Entity
    @Table(name = "albums")
    @Getter
    @Setter
    @NoArgsConstructor(access = AccessLevel.PROTECTED)
    public class Album extends AbstractPersistable<Long> {

        @NotNull
        private String title;

        @{{OneToMany}}(mappedBy = "{{album}}")
        private List<Song> songs = {{new ArrayList<>()}};

        public Album(String title) {
            this.title = title;
        }

        // getSongs(), addSong(...), removeSong(...): Puzzle „Album – Hilfsmethoden“
    }

    @Entity
    @Table(name = "songs")
    @Getter
    @Setter
    @NoArgsConstructor(access = AccessLevel.PROTECTED)
    public class Song extends AbstractPersistable<Long> {

        @NotNull
        private String title;

        @{{ManyToOne}}
        @JoinColumn(name = "album_id")
        private Album album;

        public Song(String title) {
            this.title = title;
        }
    }
  redHerrings: [ManyToMany, songs, albums, "null"]
  explanation: |
    Die besitzende Seite ist `Song` mit `@ManyToOne` – dort liegt der Fremdschlüssel. `mappedBy = "album"` nennt das **Feld** in `Song`, nicht die Tabelle. Ohne `mappedBy` hielte Hibernate die Liste für eine zweite Beziehung und legte `albums_songs` an. Die Liste wird beim Feld angelegt und ist so nie `null`.

- id: rel-album-helpers
  kind: lines
  title: Album – Hilfsmethoden
  prompt: |
    Schreib in `Album` den fachlichen Konstruktor, den Getter der Liste und die Hilfsmethoden `addSong` und `removeSong` – in dieser Reihenfolge. In den Hilfsmethoden zuerst die eigene Liste ändern, dann die Gegenseite.
  given: |
    @Entity
    @Table(name = "albums")
    @Getter
    @Setter
    @NoArgsConstructor(access = AccessLevel.PROTECTED)
    public class Album extends AbstractPersistable<Long> {

        @NotNull
        private String title;

        @OneToMany(mappedBy = "album")
        private List<Song> songs = new ArrayList<>();

        // ✎ Konstruktor, Getter, Hilfsmethoden
    }

    @Entity
    @Table(name = "songs")
    @Getter
    @Setter
    @NoArgsConstructor(access = AccessLevel.PROTECTED)
    public class Song extends AbstractPersistable<Long> {

        @NotNull
        private String title;

        @ManyToOne
        @JoinColumn(name = "album_id")
        private Album album;

        public Song(String title) {
            this.title = title;
        }
    }
  solution: |
    public Album(String title) {
        this.title = title;
    }
    public List<Song> getSongs() {
        return Collections.unmodifiableList(songs);
    }
    public void addSong(Song song) {
        songs.add(song);
        song.setAlbum(this);
    }
    public void removeSong(Song song) {
        songs.remove(song);
        song.setAlbum(null);
    }
  redHerrings:
    - "    return songs;"
    - "    song.setAlbum(album);"
    - "public Album(String title, List<Song> songs) {"
  explanation: |
    Der Getter gibt eine unveränderliche Sicht heraus – sonst könnte jeder mit `getSongs().add(...)` an `addSong` vorbei die Liste ändern. Die Hilfsmethoden setzen **beide** Seiten: Hibernate speichert nur `song.album` (die besitzende Seite), dein Java-Code sieht aber auch die Liste. `setAlbum` erzeugt Lombok in `Song`.

- id: rel-recipe-ingredients-composition
  kind: template
  title: Rezept und Zutaten – Komposition
  prompt: |
    Zutaten gehören zu genau einem Rezept. Speichern und Löschen eines Rezepts wirken auch auf seine Zutaten, und eine Zutat, die aus der Liste entfernt wird, wird gelöscht.
  uml: |
    hide empty methods
    class Recipe <<(E) Entity>> {
      - name : String {nn}
      - ingredients : Ingredient[*]
    }
    class Ingredient <<(E) Entity>> {
      - name : String {nn}
      - grams : int {nn}
    }
    Recipe "1" *-right- "n" Ingredient
  given: |
    @Entity
    @Table(name = "ingredients")
    @Getter
    @Setter
    @NoArgsConstructor(access = AccessLevel.PROTECTED)
    public class Ingredient extends AbstractPersistable<Long> {

        @NotNull
        private String name;
        private int grams;

        @ManyToOne
        @JoinColumn(name = "recipe_id", nullable = false)
        private Recipe recipe;

        public Ingredient(String name, int grams) {
            this.name = name;
            this.grams = grams;
        }
    }
  template: |
    @Entity
    @Table(name = "recipes")
    @Getter
    @Setter
    @NoArgsConstructor(access = AccessLevel.PROTECTED)
    public class Recipe extends AbstractPersistable<Long> {

        @NotNull
        private String name;

        @OneToMany(mappedBy = "recipe", {{cascade}} = CascadeType.{{ALL}}, {{orphanRemoval}} = {{true}})
        private List<Ingredient> ingredients = new ArrayList<>();

        public Recipe(String name) {
            this.name = name;
        }

        // getIngredients(), addIngredient(...), removeIngredient(...) wie bei Album
    }
  redHerrings: [PERSIST, REMOVE, "false", fetch, mappedBy]
  explanation: |
    Die ausgefüllte Raute im Diagramm ist eine **Komposition**: Zutaten leben nicht ohne ihr Rezept. `CascadeType.ALL` gibt Speichern und Löschen weiter, `orphanRemoval = true` löscht eine Zutat, sobald sie aus der Liste entfernt wird. Bei einer losen Beziehung (Filiale – Buch) passt das nicht.

