  uml: |
    hide empty methods
    class Playlist <<(E) Entity>> {
      - name : String {nn}
      - tracks : Track[*]
    }
    class Track <<(E) Entity>> {
      - title : String {nn}
    }
    Playlist -right-> "*" Track
  given: |
    @Entity
    @Table(name = "tracks")
    @Getter
    @Setter
    @NoArgsConstructor(access = AccessLevel.PROTECTED)
    @AllArgsConstructor
    public class Track extends AbstractPersistable<Long> {

