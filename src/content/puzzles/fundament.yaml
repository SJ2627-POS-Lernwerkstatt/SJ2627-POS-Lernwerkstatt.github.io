# Puzzles "Fundament" (plain Java: classes, constructors, interfaces, @Override). Format: src/lib/content/schema.ts (puzzle).
# Running example: library (Book, late fees).
# `check` is a hidden JUnit test run against the solution by scripts/verify-puzzles.ts (never shown to students).
# Verify: node scripts/verify-puzzles.ts fundament

- id: fund-book-class
  kind: lines
  title: Buch – Felder, Konstruktor, Getter
  prompt: |
    Schreib die Klasse `Book` mit den privaten Feldern `title` und `pages`, einem Konstruktor, der beide setzt, und einem Getter für `title`.
  solution: |
    public class Book {
        private String title;
        private int pages;

        public Book(String title, int pages) {
            this.title = title;
            this.pages = pages;
        }

        public String getTitle() {
            return title;
        }
    }
  redHerrings:
    - "    public void Book(String title, int pages) {"
    - "        title = title;"
    - "    public String getTitle(String title) {"
  explanation: |
    Ein Konstruktor heißt wie die Klasse und hat **keinen** Rückgabetyp – mit `void` wäre es eine normale Methode. `this.title = title` schreibt den Parameter ins Feld; `title = title` würde das Feld leer lassen. Ein Getter braucht keinen Parameter.
  check: |
    class BookCheck {
        @Test
        void check() {
            assertThat(new Book("Der Hobbit", 310).getTitle()).isEqualTo("Der Hobbit");
        }
    }

- id: fund-book-validation
  kind: lines
  title: Buch – nur gültige Objekte
  prompt: |
    Ergänze den Konstruktor: Ist `pages` nicht größer als 0, soll eine `IllegalArgumentException` fliegen. Erst danach werden die Felder gesetzt.
  given: |
    public class Book {
        private final String title;
        private final int pages;

        // ✎ Konstruktor

        public int getPages() {
            return pages;
        }
    }
  solution: |
    public Book(String title, int pages) {
        if (pages <= 0) {
            throw new IllegalArgumentException("pages must be positive");
        }
        this.title = title;
        this.pages = pages;
    }
  redHerrings:
    - "    if (pages < 0) {"
    - "        return null;"
    - "    this.pages = 0;"
  explanation: |
    „Nicht größer als 0“ heißt `pages <= 0` – auch 0 Seiten sind ungültig. Ein Konstruktor kann nichts zurückgeben, also bleibt nur die Exception. Weil die Felder `final` sind, muss der Konstruktor beide genau einmal setzen.
  check: |
    class BookValidationCheck {
        @Test
        void check() {
            assertThat(new Book("Momo", 300).getPages()).isEqualTo(300);
            assertThatThrownBy(() -> new Book("Leer", 0)).isInstanceOf(IllegalArgumentException.class);
            assertThatThrownBy(() -> new Book("Minus", -1)).isInstanceOf(IllegalArgumentException.class);
        }
    }

- id: fund-interface-policy
  kind: lines
  title: Mahngebühr – Interface implementieren
  prompt: |
    `StudentPolicy` hält den Vertrag `LateFeePolicy`: Die ersten 3 Tage sind gratis, danach kostet jeder Tag 20 Cent.
  given: |
    public interface LateFeePolicy {
        int feeInCents(int daysLate);
    }

    // ✎ StudentPolicy
  solution: |
    public class StudentPolicy implements LateFeePolicy {
        @Override
        public int feeInCents(int daysLate) {
            return Math.max(0, daysLate - 3) * 20;
        }
    }
  redHerrings:
    - "public class StudentPolicy extends LateFeePolicy {"
    - "public interface StudentPolicy implements LateFeePolicy {"
    - "    public int feeInCents(int daysLate);"
  explanation: |
    Eine Klasse **implementiert** ein Interface (`implements`), `extends` gilt für Oberklassen. Die Methode braucht einen Rumpf – nur das Interface darf sie ohne `{ … }` aufschreiben. `@Override` lässt den Compiler prüfen, dass Name und Parameter zum Interface passen. `Math.max(0, …)` verhindert negative Gebühren bei 1–3 Tagen.
  check: |
    class StudentPolicyCheck {
        @Test
        void check() {
            LateFeePolicy p = new StudentPolicy();
            assertThat(p.feeInCents(0)).isZero();
            assertThat(p.feeInCents(3)).isZero();
            assertThat(p.feeInCents(4)).isEqualTo(20);
            assertThat(p.feeInCents(10)).isEqualTo(140);
        }
    }

- id: fund-override-tostring
  kind: template
  title: Buch – toString überschreiben
  prompt: |
    `System.out.println(book)` soll `Der Hobbit (310 Seiten)` ausgeben. Ergänze die Methode.
  template: |
    public class Book {
        private final String title;
        private final int pages;

        public Book(String title, int pages) {
            this.title = title;
            this.pages = pages;
        }

        @{{Override}}
        public {{String}} {{toString()}} {
            return title + " (" + pages + " Seiten)";
        }
    }
  redHerrings:
    - "toSting()"
    - "void"
    - "toString(Book book)"
    - "Overload"
  explanation: |
    `toString()` kommt von `Object` und gibt einen `String` zurück, ohne Parameter. `@Override` fängt Tippfehler wie `toSting` ab – ohne die Annotation würde `println` weiterhin `Book@1b6d3586` ausgeben.
  check: |
    class BookToStringCheck {
        @Test
        void check() {
            assertThat(new Book("Der Hobbit", 310).toString()).isEqualTo("Der Hobbit (310 Seiten)");
        }
    }

- id: fund-inheritance-ebook
  kind: lines
  title: E-Book – von Medium erben
  prompt: |
    `Ebook` erbt von `Medium`, hat zusätzlich `sizeMb` und darf nur 7 Tage ausgeliehen werden.
  given: |
    public class Medium {
        private final String title;

        public Medium(String title) {
            this.title = title;
        }

        public String getTitle() {
            return title;
        }

        public int loanDays() {
            return 21;
        }
    }

    // ✎ Ebook
  solution: |
    public class Ebook extends Medium {
        private final double sizeMb;

        public Ebook(String title, double sizeMb) {
            super(title);
            this.sizeMb = sizeMb;
        }

        @Override
        public int loanDays() {
            return 7;
        }
    }
  redHerrings:
    - "public class Ebook implements Medium {"
    - "        this.title = title;"
    - "        super.loanDays();"
  explanation: |
    Von einer Klasse erbt man mit `extends`. Der Konstruktor ruft zuerst `super(title)` auf, denn `title` ist in `Medium` privat und hat keinen leeren Konstruktor. `loanDays()` wird mit `@Override` überschrieben.
  check: |
    class EbookCheck {
        @Test
        void check() {
            Medium m = new Ebook("Momo", 2.5);
            assertThat(m.getTitle()).isEqualTo("Momo");
            assertThat(m.loanDays()).isEqualTo(7);
            assertThat(new Medium("Krabat").loanDays()).isEqualTo(21);
        }
    }

- id: fund-equals-isbn
  kind: lines
  title: ISBN – equals und hashCode
  prompt: |
    Zwei `Isbn`-Objekte mit gleichem Text sollen gleich sein – auch in einem `HashSet`.
  given: |
    public class Isbn {
        private final String value;

        public Isbn(String value) {
            this.value = value;
        }

        // ✎ equals und hashCode
    }
  solution: |
    @Override
    public boolean equals(Object o) {
        if (this == o) return true;
        if (!(o instanceof Isbn other)) return false;
        return value.equals(other.value);
    }

    @Override
    public int hashCode() {
        return value.hashCode();
    }
  redHerrings:
    - "public boolean equals(Isbn other) {"
    - "    return value == other.value;"
    - "    return 0;"
  explanation: |
    `equals` muss `Object` als Parameter haben, sonst überschreibt es nichts (`@Override` würde das melden). Den Text vergleichst du mit `equals`, nicht mit `==`. `hashCode` gehört immer dazu – gleiche ISBN, gleicher Hash.
  check: |
    class IsbnCheck {
        @Test
        void check() {
            assertThat(new Isbn("9783608938289")).isEqualTo(new Isbn(new String("9783608938289")));
            assertThat(new Isbn("9783608938289")).isNotEqualTo(new Isbn("9783423071505"));
            java.util.Set<Isbn> set = new java.util.HashSet<>();
            set.add(new Isbn("9783608938289"));
            assertThat(set).contains(new Isbn("9783608938289"));
        }
    }

- id: fund-map-count
  kind: lines
  title: Ausleihen pro Filiale zählen
  prompt: |
    Zähle mit einer `Map`, wie viele Ausleihen es pro Filiale gibt.
  given: |
    import java.util.*;

    public class LoanStats {
        public static Map<String, Integer> countByBranch(List<String> branches) {
            // ✎ zählen
        }
    }
  solution: |
    Map<String, Integer> counts = new HashMap<>();
    for (String branch : branches) {
        counts.put(branch, counts.getOrDefault(branch, 0) + 1);
    }
    return counts;
  redHerrings:
    - "Map<String, int> counts = new HashMap<>();"
    - "    counts.put(branch, counts.get(branch) + 1);"
    - "    counts.add(branch);"
  explanation: |
    `getOrDefault(branch, 0)` liefert 0, wenn die Filiale noch nicht vorkommt – `get` würde `null` liefern, und `null + 1` wirft eine `NullPointerException`. `put` mit demselben Schlüssel überschreibt den alten Zähler. In `< >` steht `Integer`, nicht `int`.
  check: |
    class LoanStatsCheck {
        @Test
        void check() {
            assertThat(LoanStats.countByBranch(List.of("Mitte", "Nord", "Mitte")))
                .containsEntry("Mitte", 2).containsEntry("Nord", 1).hasSize(2);
            assertThat(LoanStats.countByBranch(List.of())).isEmpty();
        }
    }

- id: fund-exception-not-found
  kind: lines
  title: Buch nicht gefunden – eigene Exception
  prompt: |
    Schreib `BookNotFoundException` (unchecked) und wirf sie in `find`, wenn es kein Buch mit dieser Id gibt.
  given: |
    import java.util.*;

    // ✎ Exception

    public class BookCatalog {
        private final Map<Long, String> titles = new HashMap<>(Map.of(1L, "Momo"));

        public String find(long id) {
            String title = titles.get(id);
            if (title == null) {
                throw new BookNotFoundException(id);
            }
            return title;
        }
    }
  solution: |
    public class BookNotFoundException extends RuntimeException {
        public BookNotFoundException(long id) {
            super("Book " + id + " not found");
        }
    }
  redHerrings:
    - "public class BookNotFoundException extends Exception {"
    - "        this.message = \"Book \" + id + \" not found\";"
    - "public class BookNotFoundException implements RuntimeException {"
  explanation: |
    Mit `extends RuntimeException` ist die Exception unchecked – `find` braucht kein `throws`. Mit `extends Exception` würde `find` nicht kompilieren. Die Nachricht geht per `super(…)` an die Oberklasse.
  check: |
    class BookCatalogCheck {
        @Test
        void check() {
            assertThat(new BookCatalog().find(1L)).isEqualTo("Momo");
            assertThatThrownBy(() -> new BookCatalog().find(2L))
                .isInstanceOf(BookNotFoundException.class)
                .isInstanceOf(RuntimeException.class)
                .hasMessage("Book 2 not found");
        }
    }
