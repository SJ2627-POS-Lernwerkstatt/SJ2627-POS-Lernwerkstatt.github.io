- id: testing-aufbau-import
  unit: testing/aufbau
  main:
    kind: single
    prompt: Welcher Import gehört zu einem JUnit-Jupiter-Test?
    options:
      - "`import org.junit.Test;`"
      - "`import org.junit.jupiter.api.Test;`"
      - "`import org.springframework.test.Test;`"
      - "`import org.assertj.core.api.Test;`"
    answer: 1
    explanation: |
      Alle JUnit-Jupiter-Annotationen kommen aus `org.junit.jupiter.api`. `org.junit.Test` ist JUnit 4 – damit werden Tests in Spring-Projekten nicht richtig ausgeführt.
  followUps:
    - kind: multi
      prompt: Welche Aussagen über Testmethoden in JUnit Jupiter stimmen?
      options:
        - Testklasse und Testmethoden müssen nicht `public` sein.
        - Eine Testmethode gibt `void` zurück.
        - Die Tests einer Klasse laufen immer in der Reihenfolge, in der sie im Code stehen.
        - Jeder Test bekommt eine neue Instanz der Testklasse.
      answer: [0, 1, 3]
      explanation: |
        Die Reihenfolge der Tests ist absichtlich nicht festgelegt. Weil jeder Test eine frische Instanz bekommt, darf sich kein Test auf einen anderen verlassen.

- id: testing-aufbau-aaa
  unit: testing/aufbau
  main:
    kind: template
    prompt: Vervollständige den Test nach dem Muster Arrange – Act – Assert.
    template: |
      import org.junit.jupiter.api.{{Test}};

      import static org.assertj.core.api.Assertions.assertThat;

      class PriceCalculatorTest {

          {{@Test}}
          {{void}} verify_discount_is_applied_above_100_euro() {
              // arrange
              PriceCalculator calculator = {{new PriceCalculator()}};

              // act
              double price = {{calculator.finalPrice(120.0)}};

              // assert
              {{assertThat(price)}}.isEqualTo(108.0);
          }
      }
    redHerrings:
      - "@BeforeEach"
      - public static void
      - assertEquals(price)
    explanation: |
      Arrange baut den `PriceCalculator`, Act ruft **genau eine** Methode auf, Assert prüft das Ergebnis mit AssertJ: `assertThat(actual).isEqualTo(expected)`.
  followUps:
    - kind: single
      prompt: Die Klasse liegt in `src/main/java/shop/PriceCalculator.java`. Wo liegt der Test?
      options:
        - "`src/main/java/shop/PriceCalculatorTest.java`"
        - "`src/test/java/PriceCalculatorTest.java`"
        - "`src/test/java/shop/PriceCalculatorTest.java`"
        - "`src/test/java/test/shop/PriceCalculatorTest.java`"
      answer: 2
      explanation: |
        Gleiches Package (`shop`), aber unter `src/test/java`. So kann der Test auch package-private Klassen und Methoden verwenden.

- id: testing-aufbau-act
  unit: testing/aufbau
  main:
    kind: single
    prompt: Was ist an diesem Test problematisch?
    code: |
      @Test
      void verify_cart() {
          Cart cart = new Cart();
          cart.add(new Item("Buch", 20.0));
          assertThat(cart.total()).isEqualTo(20.0);
          cart.add(new Item("Stift", 2.0));
          assertThat(cart.total()).isEqualTo(22.0);
          cart.clear();
          assertThat(cart.total()).isZero();
      }
    options:
      - Nichts – mehr Assertions machen einen Test besser.
      - Der Test prüft mehrere Abläufe auf einmal. Schlägt er fehl, weiß man nicht sofort, welches Verhalten kaputt ist.
      - "`isZero()` gibt es in AssertJ nicht."
    answer: 1
    explanation: |
      Ein Test sollte **ein** Verhalten prüfen: ein *act*, dann die passenden Assertions. Besser wären drei Tests, z. B. `verify_total_of_one_item`, `verify_total_of_two_items` und `verify_clear_empties_cart`.

- id: testing-lebenszyklus-order
  unit: testing/lebenszyklus
  main:
    kind: single
    prompt: Eine Testklasse hat `@BeforeAll`, `@BeforeEach`, `@AfterEach` und **zwei** Tests. Wie oft läuft die `@BeforeEach`-Methode?
    options:
      - Einmal
      - Zweimal
      - Dreimal
      - Gar nicht, wenn es eine `@BeforeAll`-Methode gibt
    answer: 1
    explanation: |
      `@BeforeEach` läuft vor **jedem** Test, also zweimal. `@BeforeAll` läuft einmal vor dem ersten Test.
  followUps:
    - kind: single
      prompt: Warum muss eine `@BeforeAll`-Methode `static` sein?
      options:
        - Weil sie sonst zu langsam ist.
        - Weil sie läuft, bevor es eine Instanz der Testklasse gibt.
        - Weil JUnit nur statische Methoden aufrufen kann.
      answer: 1
      explanation: |
        JUnit legt für jeden Test eine neue Instanz an. `@BeforeAll` läuft einmal für die ganze Klasse, also vor jeder Instanz – deshalb `static`.
    - kind: multi
      prompt: Welche Daten gehören in `@BeforeEach` statt in `@BeforeAll`?
      options:
        - Ein Warenkorb, den die Tests verändern
        - Eine Liste, zu der ein Test Elemente hinzufügt
        - Eine unveränderliche Konstante wie ein Steuersatz
      answer: [0, 1]
      explanation: |
        Alles, was ein Test verändert, muss für jeden Test neu angelegt werden. Sonst sieht der nächste Test die Änderungen des vorigen. Unveränderliche Werte können als Konstante oder in `@BeforeAll` stehen.

- id: testing-lebenszyklus-fixture
  unit: testing/lebenszyklus
  main:
    kind: template
    prompt: Vor jedem Test soll ein neuer Warenkorb mit einem Buch bereitstehen. Vervollständige die Testklasse.
    template: |
      class CartTest {

          private Cart cart;

          {{@BeforeEach}}
          void setUp() {
              cart = {{new Cart()}};
              cart.add(new Item("Buch", 20.0));
          }

          @Test
          void verify_total_of_one_item() {
              assertThat({{cart.total()}}).isEqualTo(20.0);
          }
      }
    redHerrings:
      - "@BeforeAll"
      - static Cart cart
      - cart.items()
    explanation: |
      `@BeforeEach` baut die Ausgangslage vor **jedem** Test neu auf. Mit `@BeforeAll` müsste die Methode `static` sein, und alle Tests würden sich denselben Warenkorb teilen.

- id: testing-lesbar-nested
  unit: testing/lesbar
  main:
    kind: single
    prompt: Warum laufen die Tests in `WithOneItem` nicht wie gedacht?
    code: |
      class CartTest {
          private Cart cart;

          @BeforeEach
          void setUp() {
              cart = new Cart();
          }

          @Nested
          static class WithOneItem {
              @Test
              void total_is_price_of_item() { /* ... */ }
          }
      }
    options:
      - "`@Nested` gibt es nur in JUnit 4."
      - Die innere Klasse ist `static`. Sie kann `cart` nicht verwenden, und das `@BeforeEach` der äußeren Klasse läuft für sie nicht.
      - Innere Klassen brauchen ein `public`.
    answer: 1
    explanation: |
      `@Nested`-Klassen sind **nicht-statische** innere Klassen. Nur dann teilen sie sich die Instanz und die Lifecycle-Methoden der äußeren Klasse.
  followUps:
    - kind: single
      prompt: In welcher Reihenfolge laufen die Methoden für einen Test in einer `@Nested`-Klasse, wenn außen und innen je ein `@BeforeEach` steht?
      options:
        - Erst das innere, dann das äußere `@BeforeEach`, dann der Test
        - Erst das äußere, dann das innere `@BeforeEach`, dann der Test
        - Nur das innere `@BeforeEach`
      answer: 1
      explanation: |
        Von außen nach innen: Das äußere `@BeforeEach` legt z. B. den leeren Warenkorb an, das innere fügt einen Artikel hinzu.

- id: testing-lesbar-names
  unit: testing/lesbar
  main:
    kind: multi
    prompt: Welche Testnamen beschreiben Verhalten und Bedingung?
    options:
      - "`test1()`"
      - "`verify_discount_is_applied_above_100_euro()`"
      - "`finalPrice_below100_returnsSamePrice()`"
      - "`testCart()`"
    answer: [1, 2]
    explanation: |
      Ein guter Testname sagt, **was** passieren soll und **wann**. `test1` und `testCart` verraten nichts – man muss den Test lesen, um zu wissen, was er prüft.
  followUps:
    - kind: single
      prompt: Was bewirkt `@DisplayName("Ab 100 Euro gibt es 10 % Rabatt")` an einer Testmethode?
      options:
        - Der Text erscheint im Testbericht statt des Methodennamens.
        - Der Test läuft nur, wenn der Text im Code vorkommt.
        - Der Text wird als Fehlermeldung verwendet, wenn eine Assertion fehlschlägt.
      answer: 0
      explanation: |
        `@DisplayName` ändert nur die Anzeige in der IDE und im Testbericht. Für Fehlermeldungen gibt es in AssertJ `as(...)`.

- id: testing-assertj-bigdecimal
  unit: testing/assertj-grundlagen
  main:
    kind: single
    prompt: Welche Assertion ist **grün**?
    options:
      - "`assertThat(new BigDecimal(\"2.50\")).isEqualTo(new BigDecimal(\"2.5\"));`"
      - "`assertThat(new BigDecimal(\"2.50\")).isEqualByComparingTo(\"2.5\");`"
      - "`assertThat(0.1 + 0.2).isEqualTo(0.3);`"
    answer: 1
    explanation: |
      `BigDecimal.equals` vergleicht auch die Nachkommastellen (`2.50` ≠ `2.5`), `isEqualByComparingTo` nur den Zahlenwert. `0.1 + 0.2` ergibt bei `double` `0.30000000000000004` – dafür gibt es `isCloseTo(0.3, within(0.0001))`.
  followUps:
    - kind: template
      prompt: Prüfe einen berechneten `double`-Wert mit einer Toleranz von 0,01.
      template: |
        assertThat({{average}}).{{isCloseTo}}(2.33, {{within(0.01)}});
      redHerrings:
        - isEqualTo
        - isEqualByComparingTo
        - offset
      explanation: |
        `isCloseTo(expected, within(tolerance))` – `within` wird statisch aus `org.assertj.core.api.Assertions` importiert.

- id: testing-assertj-order
  unit: testing/assertj-grundlagen
  main:
    kind: single
    prompt: "`finalPrice(120.0)` liefert wegen eines Fehlers `100.0` statt `108.0`. Der Test meldet: *expected: 100.0 but was: 108.0*. Warum ist die Meldung verkehrt herum?"
    code: |
      double price = calculator.finalPrice(120.0);
      assertEquals(price, 108.0);
    options:
      - JUnit vertauscht die Werte bei `double` immer.
      - Die Argumente von `assertEquals` sind vertauscht – erst kommt der erwartete, dann der tatsächliche Wert.
      - "`assertEquals` kann keine `double`-Werte vergleichen."
    answer: 1
    explanation: |
      Bei JUnit ist die Reihenfolge `assertEquals(expected, actual)`. Hier steht der tatsächliche Wert zuerst, deshalb hält JUnit `100.0` für den erwarteten Wert. Mit AssertJ passiert das nicht: `assertThat(actual).isEqualTo(expected)`.
  followUps:
    - kind: single
      prompt: Was ist der Unterschied zwischen `isEqualTo` und `isSameAs`?
      options:
        - Keiner, beide vergleichen mit `equals`.
        - "`isEqualTo` vergleicht mit `equals` den Inhalt, `isSameAs` mit `==`, ob es dasselbe Objekt ist."
        - "`isSameAs` ignoriert Groß- und Kleinschreibung."
      answer: 1
      explanation: |
        Zwei gleiche Records sind `isEqualTo`, aber nur dann `isSameAs`, wenn es dieselbe Instanz ist.

- id: testing-collections-exactly
  unit: testing/assertj-collections
  main:
    kind: single
    prompt: "`names` ist `[\"Ben\", \"Anna\", \"Cem\"]`. Welche Assertion schlägt fehl?"
    options:
      - "`assertThat(names).contains(\"Anna\", \"Ben\");`"
      - "`assertThat(names).containsExactlyInAnyOrder(\"Anna\", \"Ben\", \"Cem\");`"
      - "`assertThat(names).containsExactly(\"Anna\", \"Ben\", \"Cem\");`"
      - "`assertThat(names).hasSize(3);`"
    answer: 2
    explanation: |
      `containsExactly` verlangt alle Elemente **in dieser Reihenfolge**. `contains` verlangt nur, dass die genannten vorkommen; `containsExactlyInAnyOrder` alle, egal in welcher Reihenfolge.
  followUps:
    - kind: single
      prompt: Ein Repository liefert alle Schüler einer Klasse, ohne `order by`. Welche Prüfung ist die richtige?
      options:
        - "`containsExactly(...)`"
        - "`containsExactlyInAnyOrder(...)`"
        - "`contains(...)`"
      answer: 1
      explanation: |
        Ohne Sortierung ist die Reihenfolge der Zeilen nicht festgelegt. `containsExactlyInAnyOrder` prüft trotzdem, dass genau die richtigen Schüler kommen – nicht mehr und nicht weniger.

- id: testing-collections-extracting
  unit: testing/assertj-collections
  main:
    kind: template
    prompt: Prüfe Name und Preis aller Artikel, ohne eigene `Item`-Objekte zu bauen.
    template: |
      assertThat(items)
              .{{extracting}}(Item::name, {{Item::price}})
              .{{containsExactly}}(
                      {{tuple}}("Buch", 20.0),
                      tuple("Stift", 2.0));
    redHerrings:
      - filteredOn
      - Item::getPrice
      - new Item
    explanation: |
      `extracting` mit mehreren Methodenreferenzen liefert pro Element ein Tupel; mit `tuple(...)` gibst du die erwarteten Werte an. Bei einem Record heißt der Getter `price()`, nicht `getPrice()`.
  followUps:
    - kind: single
      prompt: Was prüft diese Assertion?
      code: |
        assertThat(items)
                .filteredOn(item -> item.price() > 10)
                .extracting(Item::name)
                .containsExactly("Buch");
      options:
        - Dass alle Artikel teurer als 10 sind
        - Dass genau ein Artikel teurer als 10 ist, und zwar „Buch“
        - Dass „Buch“ in der Liste vorkommt
      answer: 1
      explanation: |
        `filteredOn` lässt nur Artikel über 10 übrig; davon werden die Namen genommen, und es muss genau `["Buch"]` herauskommen.

- id: testing-verketten-optional
  unit: testing/assertj-verketten
  main:
    kind: template
    prompt: Prüfe, dass die gespeicherte Station gefunden wird und Name und Kapazität stimmen.
    template: |
      Station saved = repository.save(new Station("Westbahnhof", "Europaplatz 2", 24));

      assertThat(repository.{{findById(saved.getId())}})
              .{{hasValueSatisfying}}(found -> {
                  assertThat({{found.getName()}}).isEqualTo("Westbahnhof");
                  assertThat(found.getCapacity()).isEqualTo(24);
              });
    redHerrings:
      - findById(saved.getId()).get()
      - satisfiesExactly
      - saved.getName()
    explanation: |
      `findById` liefert ein `Optional`. `hasValueSatisfying` prüft, dass ein Wert da ist, und gibt ihn an das Lambda weiter. Im Lambda prüfst du `found` – das aus der Datenbank gelesene Objekt, nicht `saved`.
  followUps:
    - kind: single
      prompt: Was passiert bei `repository.findById(id).get()`, wenn es keinen Datensatz mit dieser Id gibt?
      options:
        - Es kommt `null` zurück.
        - Es fliegt eine `NoSuchElementException`.
        - Der Test wird übersprungen.
      answer: 1
      explanation: |
        `Optional.get()` auf einem leeren `Optional` wirft `NoSuchElementException: No value present`. Mit `hasValueSatisfying` bekommst du stattdessen eine klare Meldung.

- id: testing-verketten-lists
  unit: testing/assertj-verketten
  main:
    kind: single
    prompt: Eine Abfrage soll **genau einen** Artikel liefern, und zwar „Buch“. Welche Assertion prüft beides?
    options:
      - "`assertThat(result).first().returns(\"Buch\", Item::name);`"
      - "`assertThat(result).singleElement().returns(\"Buch\", Item::name);`"
      - "`assertThat(result).anySatisfy(i -> assertThat(i.name()).isEqualTo(\"Buch\"));`"
    answer: 1
    explanation: |
      `singleElement()` schlägt fehl, wenn die Liste nicht genau ein Element hat. `first()` und `anySatisfy` wären auch bei mehreren Treffern grün.
  followUps:
    - kind: multi
      prompt: "`items` ist `[Buch 20.0, Stift 2.0]`. Welche Assertions sind grün?"
      options:
        - "`assertThat(items).allSatisfy(i -> assertThat(i.price()).isPositive());`"
        - "`assertThat(items).noneSatisfy(i -> assertThat(i.price()).isGreaterThan(10));`"
        - "`assertThat(items).element(1).returns(\"Stift\", Item::name);`"
        - "`assertThat(items).first().returns(20.0, Item::price);`"
      answer: [0, 2, 3]
      explanation: |
        Das Buch kostet mehr als 10, also ist `noneSatisfy` rot. `element(1)` ist das **zweite** Element (Index ab 0), also der Stift.

- id: testing-exceptions-lambda
  unit: testing/exceptions
  main:
    kind: single
    prompt: Der Code wirft richtig eine `IllegalArgumentException`. Trotzdem ist der Test rot. Warum?
    code: |
      @Test
      void remove_unknown_item_fails() {
          Cart cart = new Cart();
          cart.remove("Heft");
          assertThatThrownBy(() -> {})
                  .isInstanceOf(IllegalArgumentException.class);
      }
    options:
      - "`assertThatThrownBy` funktioniert nur mit eigenen Exceptions."
      - Der Aufruf steht nicht im Lambda. Die Exception fliegt, bevor AssertJ sie fangen kann.
      - Es fehlt `hasMessage(...)`.
    answer: 1
    explanation: |
      Richtig ist `assertThatThrownBy(() -> cart.remove("Heft")).isInstanceOf(IllegalArgumentException.class);` – nur so kann AssertJ den Aufruf selbst ausführen und die Exception fangen.
  followUps:
    - kind: template
      prompt: Prüfe Typ und Meldung der Exception.
      template: |
        {{assertThatThrownBy}}(() -> {{cart.remove("Heft")}})
                .{{isInstanceOf}}(IllegalArgumentException.class)
                .{{hasMessageContaining}}("Heft");
      redHerrings:
        - assertThat
        - isThrownBy
        - withMessage
      explanation: |
        `assertThatThrownBy(lambda)` führt den Aufruf aus; danach prüfst du mit `isInstanceOf` den Typ und mit `hasMessage`/`hasMessageContaining` die Meldung. `isThrownBy` und `withMessage` gehören zur anderen Form, `assertThatExceptionOfType(...)`.

- id: testing-exceptions-forms
  unit: testing/exceptions
  main:
    kind: multi
    prompt: Mit welchen Zeilen prüfst du, dass `calculator.finalPrice(-1)` eine `IllegalArgumentException` wirft?
    options:
      - "`assertThatIllegalArgumentException().isThrownBy(() -> calculator.finalPrice(-1));`"
      - "`assertThatExceptionOfType(IllegalArgumentException.class).isThrownBy(() -> calculator.finalPrice(-1));`"
      - "`assertThrows(IllegalArgumentException.class, () -> calculator.finalPrice(-1));`"
      - "`assertThat(calculator.finalPrice(-1)).isInstanceOf(IllegalArgumentException.class);`"
    answer: [0, 1, 2]
    explanation: |
      Die ersten drei sind gleichwertig. Die letzte ruft `finalPrice(-1)` direkt auf – die Exception fliegt, bevor `assertThat` überhaupt etwas bekommt.
  followUps:
    - kind: single
      prompt: Wie prüfst du, dass ein gültiger Artikel **ohne** Exception hinzugefügt wird?
      options:
        - "`assertThatCode(() -> cart.add(item)).doesNotThrowAnyException();`"
        - "`assertThatThrownBy(() -> cart.add(item)).isNull();`"
        - "`assertThat(cart.add(item)).isNotNull();`"
      answer: 0
      explanation: |
        `assertThatCode(...).doesNotThrowAnyException()` ist genau dafür da. `assertThatThrownBy` schlägt immer fehl, wenn nichts geworfen wird.

- id: testing-param-csv
  unit: testing/parametrisiert-1
  main:
    kind: template
    prompt: Teste die Altersgrenze zwischen Jugend und Erwachsenen von beiden Seiten.
    template: |
      {{@ParameterizedTest}}
      {{@CsvSource}}({
              "17, YOUTH",
              "18, ADULT"
      })
      void category_for_age({{int age, Ticket.Category expected}}) {
          assertThat(Ticket.categoryFor(age)).isEqualTo({{expected}});
      }
    redHerrings:
      - "@Test"
      - "@ValueSource"
      - String age, String expected
    explanation: |
      Pro Zeile von `@CsvSource` ein Durchlauf. JUnit wandelt `"17"` in `int` und `"YOUTH"` in das Enum um. Ein `@ParameterizedTest` braucht kein zusätzliches `@Test`.
  followUps:
    - kind: single
      prompt: Ein Rabatt gilt **ab** 100 Euro. Welche Werte testen die Grenze am besten?
      options:
        - 50 und 150
        - 99.99 und 100
        - 100 und 1000
      answer: 1
      explanation: |
        Fehler passieren an der Grenze (`>` statt `>=`). Deshalb testest du den Wert direkt an der Grenze und den direkt daneben.

- id: testing-param-null
  unit: testing/parametrisiert-1
  main:
    kind: single
    prompt: Wie oft läuft dieser Test?
    code: |
      @ParameterizedTest
      @NullAndEmptySource
      @ValueSource(strings = {" ", "ABC1234"})
      void invalid_codes(String code) {
          assertThat(Ticket.isValidCode(code)).isFalse();
      }
    options:
      - Zweimal
      - Dreimal
      - Viermal
    answer: 2
    explanation: |
      `@NullAndEmptySource` liefert `null` und `""`, `@ValueSource` zwei weitere Werte – zusammen vier Durchläufe.
  followUps:
    - kind: single
      prompt: "Welchen Wert bekommt `code` in der Zeile `\", false\"` einer `@CsvSource`?"
      options:
        - "`\"\"` (leerer String)"
        - "`null`"
        - "`\" \"` (ein Leerzeichen)"
      answer: 1
      explanation: |
        Ein ganz leerer Wert wird zu `null`. Einen leeren String schreibst du als `''`.
    - kind: single
      prompt: Was macht `@EnumSource(Ticket.Category.class)`?
      options:
        - Der Test läuft einmal pro Wert des Enums.
        - Der Test läuft nur für den ersten Enum-Wert.
        - Der Test bekommt alle Enum-Werte als Array.
      answer: 0
      explanation: |
        Ein Durchlauf pro Enum-Wert. Mit `names` und `mode = EXCLUDE` kannst du einzelne Werte ausnehmen.

- id: testing-param-method
  unit: testing/parametrisiert-2
  main:
    kind: template
    prompt: Liefere die Testdaten für einen Test mit den Parametern `(List<Item> items, double expected)`.
    template: |
      static {{Stream<Arguments>}} carts() {
          return Stream.of(
                  {{arguments}}(List.of(), 0.0),
                  arguments({{List.of(new Item("Buch", 20.0))}}, 20.0));
      }

      @ParameterizedTest
      {{@MethodSource("carts")}}
      void total_is_sum_of_prices(List<Item> items, double expected) {
          // ...
      }
    redHerrings:
      - List<Item>
      - "@CsvSource(\"carts\")"
      - "@ValueSource"
    explanation: |
      Die Quellmethode ist `static` und liefert einen `Stream<Arguments>`. Jedes `arguments(...)` ist ein Durchlauf; die Werte kommen in der Reihenfolge der Parameter.
  followUps:
    - kind: single
      prompt: Was passiert, wenn die Quellmethode `carts()` nicht `static` ist?
      options:
        - Nichts, JUnit legt dafür eine Instanz an.
        - JUnit bricht mit einer Fehlermeldung ab, bevor ein Durchlauf startet.
        - Der Test läuft ohne Argumente.
      answer: 1
      explanation: |
        Quellmethoden müssen `static` sein (außer mit `@TestInstance(Lifecycle.PER_CLASS)`). Sonst meldet JUnit „must be static“.

- id: testing-param-names
  unit: testing/parametrisiert-2
  main:
    kind: single
    prompt: Du willst im Testbericht `[1] leerer Warenkorb` statt einer langen Liste von Objekten sehen. Was verwendest du in der Quellmethode?
    options:
      - "`arguments(\"leerer Warenkorb\", List.of(), 0.0)`"
      - "`argumentSet(\"leerer Warenkorb\", List.of(), 0.0)`"
      - "`@DisplayName(\"leerer Warenkorb\")`"
    answer: 1
    explanation: |
      `argumentSet(name, ...)` gibt dem Fall einen Namen, der nicht als Argument übergeben wird. Bei `arguments(...)` wäre der Name einfach ein zusätzliches erstes Argument.
  followUps:
    - kind: multi
      prompt: Welche Quellen liefern Objekte (nicht nur Zahlen und Strings) an einen parametrisierten Test?
      options:
        - "`@MethodSource`"
        - "`@FieldSource`"
        - "`@ValueSource`"
        - "`@CsvSource`"
      answer: [0, 1]
      explanation: |
        `@ValueSource` und `@CsvSource` enthalten nur Text und einfache Werte, die JUnit umwandelt. Beliebige Objekte kommen aus einer Methode oder einem statischen Feld.

- id: testing-testdaten-grenzen
  unit: testing/testdaten
  main:
    kind: multi
    prompt: "Regel: *Ab 85 % Auslastung wird der volle Preis verrechnet, darunter der halbe.* Welche Testwerte prüfen die Grenze?"
    options:
      - 84.99 %
      - 85 %
      - 50 %
      - 100 %
    answer: [0, 1]
    explanation: |
      An der Grenze testest du **beide Seiten**: den Wert direkt darunter und den Wert genau auf der Grenze. 50 % und 100 % sind typische Werte ihrer Klasse – gut als zusätzliche Fälle, aber sie finden einen `>`-statt-`>=`-Fehler nicht.
  followUps:
    - kind: single
      prompt: Ein Test prüft eine Funktion, die zwei Preise addieren soll, mit den Werten 10 und 10. Die Funktion verdoppelt aber fälschlich den ersten Preis. Was passiert?
      options:
        - Der Test ist rot.
        - Der Test ist grün – der Fehler fällt mit diesen Werten nicht auf.
        - Der Test bricht mit einer Exception ab.
      answer: 1
      explanation: |
        10 + 10 und 2 × 10 ergeben beide 20. Wähle Testdaten mit **unterschiedlichen** Werten (z. B. 20 und 2), damit Verwechslungen auffallen.

- id: testing-testdaten-fixtures
  unit: testing/testdaten
  main:
    kind: single
    prompt: Warum liefert `TestFixtures.book()` bei jedem Aufruf ein **neues** Objekt, statt ein statisches Feld `BOOK` zurückzugeben?
    options:
      - Weil statische Felder in Testklassen verboten sind.
      - Damit kein Test die Daten eines anderen Tests verändern kann.
      - Weil Records keine statischen Felder haben dürfen.
    answer: 1
    explanation: |
      Ein gemeinsames, veränderliches Objekt verbindet Tests miteinander: Ändert einer es, hängt das Ergebnis des nächsten von der Reihenfolge ab. Frische Objekte halten jeden Test unabhängig. (Bei unveränderlichen Records wäre ein gemeinsames Objekt unproblematisch – bei Entities nicht.)
  followUps:
    - kind: single
      prompt: Wo liegt die Klasse `TestFixtures`?
      options:
        - In `src/main/java`, damit auch der Service sie verwenden kann
        - In `src/test/java`, im Package der Tests
        - In `src/test/resources`
      answer: 1
      explanation: |
        Testdaten gehören zum Testcode und landen nicht im fertigen Programm.

- id: testing-mockito-setup
  unit: testing/mockito-1
  main:
    kind: template
    prompt: Teste `ShopService` mit gemocktem Repository und Notifier.
    template: |
      {{@ExtendWith(MockitoExtension.class)}}
      class ShopServiceTest {

          {{@Mock}}
          private ItemRepository repository;

          @Mock
          private Notifier notifier;

          {{@InjectMocks}}
          private ShopService service;

          @Test
          void price_of_known_item() {
              {{when}}(repository.findByName("Buch"))
                      .{{thenReturn}}(Optional.of(new Item("Buch", 20.0)));

              assertThat(service.priceOf("Buch")).isEqualTo(20.0);
          }
      }
    redHerrings:
      - "@MockitoBean"
      - "@Autowired"
      - verify
      - thenAnswer
    explanation: |
      `MockitoExtension` erzeugt vor jedem Test die `@Mock`-Felder und baut mit `@InjectMocks` den Service, dem es die Mocks über den Konstruktor übergibt. `@MockitoBean` brauchst du nur in Spring-Tests wie `@WebMvcTest`.
  followUps:
    - kind: single
      prompt: Was liefert ein Mock für `Optional<Item> findByName(String)`, wenn du kein `when(...)` dafür geschrieben hast?
      options:
        - "`null`"
        - Ein leeres `Optional`
        - Eine Exception
      answer: 1
      explanation: |
        Mockito liefert „leere“ Standardwerte: leeres `Optional`, leere Liste, `0`, `false` und `null` für andere Objekte.

- id: testing-mockito-strict
  unit: testing/mockito-1
  main:
    kind: single
    prompt: Warum schlägt dieser Test mit `UnnecessaryStubbingException` fehl?
    code: |
      @Test
      void add_item() {
          when(repository.findByName("Buch")).thenReturn(Optional.of(book));

          service.addItem("Heft", 1.5);
      }
    options:
      - "`addItem` ruft `findByName` nie auf – das `when` ist überflüssig."
      - "`thenReturn` darf kein `Optional` zurückgeben."
      - Es fehlt `verify`.
    answer: 0
    explanation: |
      Die `MockitoExtension` meldet jedes Stubbing, das im Test nicht verwendet wurde. Lösch die Zeile – oder überleg, ob der Test eigentlich etwas anderes prüfen sollte.
  followUps:
    - kind: single
      prompt: Wie ersetzt du das Service in einem `@WebMvcTest` (Aufgabe 3) durch einen Mock?
      options:
        - "`@Mock`"
        - "`@MockitoBean`"
        - "`@InjectMocks`"
      answer: 1
      explanation: |
        In Spring-Tests muss der Mock als Bean im Kontext liegen, damit der Controller ihn bekommt – dafür gibt es `@MockitoBean`.

- id: testing-mockito-verify
  unit: testing/mockito-2
  main:
    kind: template
    prompt: Prüfe, dass ein unbekannter Artikel weder gelöscht noch gemeldet wird.
    template: |
      @Test
      void unknown_item_is_not_deleted() {
          when(repository.findByName("Heft")).thenReturn(Optional.empty());

          assertThatIllegalArgumentException().isThrownBy(() -> service.discontinue("Heft"));

          {{verify(repository, never())}}.delete({{any()}});
          {{verifyNoInteractions}}(notifier);
      }
    redHerrings:
      - verify(repository)
      - times(0)
      - when
    explanation: |
      `verify(mock, never())` prüft, dass die Methode nie aufgerufen wurde; mit `any()` ist das Argument egal. `verifyNoInteractions` prüft, dass am Notifier gar nichts aufgerufen wurde. (`times(0)` würde auch funktionieren, ist aber schwerer zu lesen.)
  followUps:
    - kind: single
      prompt: Welche Zeile ist **falsch**?
      options:
        - "`verify(notifier).send(\"einkauf@shop.at\", \"Buch ausgelistet\");`"
        - "`verify(notifier).send(eq(\"einkauf@shop.at\"), anyString());`"
        - "`verify(notifier).send(\"einkauf@shop.at\", anyString());`"
        - "`verify(notifier).send(anyString(), contains(\"Buch\"));`"
      answer: 2
      explanation: |
        Mit einem Matcher müssen **alle** Argumente Matcher sein. Den festen Wert verpackst du in `eq(...)` – sonst gibt es eine `InvalidUseOfMatchersException`.

- id: testing-mockito-dothrow
  unit: testing/mockito-2
  main:
    kind: single
    prompt: "`Notifier.send(...)` ist eine `void`-Methode. Wie lässt du sie im Test eine Exception werfen?"
    options:
      - "`when(notifier.send(anyString(), anyString())).thenThrow(new IllegalStateException());`"
      - "`doThrow(new IllegalStateException()).when(notifier).send(anyString(), anyString());`"
      - "`verify(notifier).send(anyString(), anyString()).thenThrow(new IllegalStateException());`"
    answer: 1
    explanation: |
      `when(...)` braucht einen Rückgabewert und kompiliert bei `void`-Methoden nicht. Die Form `doThrow(...).when(mock).methode(...)` funktioniert für alle Methoden.
  followUps:
    - kind: single
      prompt: "Was bewirkt `when(repository.save(any(Item.class))).thenAnswer(returnsFirstArg());`?"
      options:
        - "`save` gibt immer `null` zurück."
        - "`save` gibt das Objekt zurück, das übergeben wurde."
        - "`save` speichert das Objekt wirklich in der Datenbank."
      answer: 1
      explanation: |
        `returnsFirstArg()` aus `AdditionalAnswers` gibt das erste Argument zurück – wie ein echtes `save`, nur ohne Datenbank.
