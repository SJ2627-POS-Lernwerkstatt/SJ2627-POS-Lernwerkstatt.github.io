- id: jpa-uml-stereotypes
  unit: jpa/uml
  main:
    kind: single
    prompt: Im Diagramm steht `class Address <<(V) ValueObject>>`. Wie wird `Address` umgesetzt?
    options:
      - Als `@Entity` mit eigener Tabelle und Repository
      - Als `@Embeddable` ohne Id, die Spalten landen in der Tabelle des Besitzers
      - Als `enum` mit einem Converter
      - Gar nicht, Value Objects stehen nur zur Information im Diagramm
    answer: 1
    explanation: |
      Ein Value Object hat keine Identität und keine eigene Tabelle. Es wird mit `@Embeddable` umgesetzt und mit `@Embedded` in das Entity eingebettet (Einheit 7).
  followUps:
    - kind: multi
      prompt: Welche Klassen aus einem Matura-Diagramm bekommen ein eigenes Repository?
      options:
        - "`«Entity»`"
        - "`«ValueObject»`"
        - "`«RichType»`"
        - "`«Enumeration»`"
      answer: [0]
      explanation: |
        Nur Entities haben eine eigene Tabelle und eine Id, also auch ein Repository. Value Objects, Rich Types und Enums werden mit ihrem Entity gespeichert.
    - kind: single
      prompt: Ein `«RichType»` `Isbn` mit einem Attribut `value`. Wie viele Spalten bekommt das Feld `isbn` im Entity `Book`?
      options:
        - Eine
        - Eine pro Attribut des Rich Types
        - Keine, es bekommt eine eigene Tabelle
      answer: 0
      explanation: |
        Ein Rich Type wird über einen `AttributeConverter` auf **eine** Spalte abgebildet (Einheit 8).

- id: jpa-uml-attributes
  unit: jpa/uml
  main:
    kind: single
    prompt: "Was bedeutet `- logTimestamp : DateTime {nn}`?"
    options:
      - "Ein Feld `logTimestamp` vom Typ `LocalDateTime`, das nie `null` sein darf"
      - "Ein Feld `logTimestamp` vom Typ `LocalDate`, das eindeutig sein muss"
      - "Ein Feld `logTimestamp`, das nicht gespeichert wird"
    answer: 0
    explanation: |
      `DateTime` wird in Java zu `LocalDateTime` (Datum **und** Uhrzeit), `{nn}` heißt *not null*. Eindeutigkeit steht, wenn gefordert, im Text der Angabe.
  followUps:
    - kind: single
      prompt: Im Diagramm fehlt bei jedem Entity das Attribut `id`. Was tust du?
      options:
        - Nichts, ohne `id` im Diagramm braucht das Entity keinen Primary Key
        - Ich ergänze selbst einen Primary Key, z. B. mit `AbstractPersistable<Long>`
        - Ich nehme das erste Attribut als Primary Key
      answer: 1
      explanation: |
        Technische Attribute wie die Id stehen nie im Diagramm. Jedes Entity braucht trotzdem einen Primary Key – die Beurteilung prüft, dass er „richtig definiert“ ist.

- id: jpa-uml-lines
  unit: jpa/uml
  main:
    kind: single
    prompt: "Was bedeutet die Linie `Book \"n\" -- \"1\" Branch`?"
    options:
      - Ein Buch gehört zu vielen Filialen, beide Seiten kennen sich
      - Viele Bücher gehören zu einer Filiale, beide Seiten kennen sich
      - Viele Bücher gehören zu einer Filiale, nur `Book` kennt `Branch`
    answer: 1
    explanation: |
      Die Multiplizität steht auf der Seite, die gezählt wird: `"n"` bei `Book`, `"1"` bei `Branch`. Ohne Pfeilspitze ist die Beziehung bidirektional – `Book` hat ein Feld `branch`, `Branch` eine Liste `books`.
  followUps:
    - kind: single
      prompt: "Was ändert sich bei `DividerBoxAtStorage \"n\" --> \"0,1\" StorageRoom`?"
      options:
        - Nur `DividerBoxAtStorage` kennt den Raum, und der Raum darf fehlen
        - Beide kennen sich, und der Raum ist Pflicht
        - "`StorageRoom` hat eine Liste von `DividerBoxAtStorage`"
      answer: 0
      explanation: |
        Der Pfeil zeigt, wer wen kennt: nur `DividerBoxAtStorage` hat ein Feld `storageRoom`. `"0,1"` heißt: höchstens ein Raum, darf aber `null` sein.

- id: jpa-entity-minimum
  unit: jpa/entity
  main:
    kind: multi
    prompt: Was braucht eine Klasse **mindestens**, damit Hibernate sie als Entity abbildet?
    options:
      - "`@Entity`"
      - "`@Table`"
      - Ein Feld mit `@Id` (oder eine geerbte Id)
      - "`@GeneratedValue`"
      - Einen Konstruktor mit allen Attributen
    answer: [0, 2]
    explanation: |
      Pflicht sind `@Entity` und eine Id. `@Table` ist empfohlen, `@GeneratedValue` lässt die Id automatisch vergeben, und der fachliche Konstruktor ist für dich, nicht für JPA.
  followUps:
    - kind: template
      prompt: Mach `Book` zu einem Entity in der Tabelle `books`, mit einer Id von Spring Data.
      template: |
        @{{Entity}}
        @Table(name = "{{books}}")
        public class Book extends {{AbstractPersistable<Long>}} {

            private String title;
        }
      redHerrings:
        - Embeddable
        - AbstractPersistable<long>
        - Book
      explanation: |
        `@Entity` plus `extends AbstractPersistable<Long>` – der Typ der Id muss ein Objekttyp sein, deshalb `Long`, nicht `long`. Der Tabellenname kommt aus der Angabe, hier `books`.

- id: jpa-entity-naming
  unit: jpa/entity
  main:
    kind: single
    prompt: Wie heißt die Spalte für dieses Feld in der Datenbank?
    code: |
      @Entity
      public class Book extends AbstractPersistable<Long> {
          private LocalDate publishedOn;
      }
    options:
      - "`publishedOn`"
      - "`published_on`"
      - "`PUBLISHEDON`"
      - "`book_published_on`"
    answer: 1
    explanation: |
      Spring Boot wandelt camelCase in Namen mit Unterstrich um: `publishedOn` → `published_on`. Die Tabelle heißt ohne `@Table` entsprechend `book`.
  followUps:
    - kind: single
      prompt: "`Book` erweitert `AbstractPersistable<Long>`. Was liefert `book.getId()` für ein neues Buch, das noch nicht gespeichert wurde?"
      options:
        - "`0`"
        - "`null`"
        - Eine zufällige Id
        - Eine `IllegalStateException`
      answer: 1
      explanation: |
        Die Id vergibt erst Hibernate beim Speichern. Vorher ist sie `null`, und `isNew()` liefert `true`.

- id: jpa-entity-equals
  unit: jpa/entity
  main:
    kind: single
    prompt: "`Book` hat eine eigene Id (`@Id @GeneratedValue private Long id;`) und **kein** `equals`. Was liefert `reread.equals(saved)`?"
    code: |
      Book saved = bookRepository.save(book);
      entityManager.flush();
      entityManager.clear();
      Book reread = bookRepository.findById(saved.getId()).orElseThrow();
    options:
      - "`true`, die Id ist gleich"
      - "`false`, es sind zwei verschiedene Objekte und `equals` vergleicht nur die Referenz"
      - Der Code kompiliert nicht
    answer: 1
    explanation: |
      Ohne eigenes `equals` gilt das `equals` von `Object`: gleich nur bei derselben Referenz. Nach `clear()` liest Hibernate ein neues Objekt. Mit `AbstractPersistable` wäre das Ergebnis `true`, weil dort Klasse und Id verglichen werden.
  followUps:
    - kind: single
      prompt: Zwei **neue**, noch nicht gespeicherte Bücher mit gleichem Titel, beide `extends AbstractPersistable<Long>`. Sind sie `equals`?
      options:
        - Ja, alle Attribute sind gleich
        - Nein, ohne Id ist ein Entity nur gleich zu sich selbst
        - Ja, beide haben die Id `null`
      answer: 1
      explanation: |
        `AbstractPersistable.equals` vergleicht die Id. Ist sie `null`, ist das Objekt nur zu sich selbst gleich – sonst wären alle neuen Bücher gleich.

- id: jpa-constructors-noargs
  unit: jpa/konstruktoren
  main:
    kind: single
    prompt: Welcher Konstruktor gehört für JPA in jedes Entity?
    options:
      - "`public Book() {}`, damit jeder Code leere Bücher erzeugen kann"
      - "`protected Book() {}`, für JPA, aber nicht für deinen eigenen Code"
      - "`private Book() {}`, damit niemand ihn verwendet"
      - Keiner, Hibernate braucht keinen Konstruktor
    answer: 1
    explanation: |
      Hibernate erzeugt beim Lesen erst ein leeres Objekt und füllt dann die Felder. Dafür braucht es einen Konstruktor ohne Parameter, `public` oder `protected`. `protected` verhindert, dass dein Code halbfertige Objekte baut.
  followUps:
    - kind: single
      prompt: Der Konstruktor ohne Parameter fehlt. Wann fällt das auf?
      options:
        - Beim Kompilieren
        - Beim Start der Anwendung
        - Beim Speichern mit `save`
        - Erst, wenn das Entity aus der Datenbank gelesen wird
      answer: 3
      explanation: |
        Hibernate startet und speichert ohne Probleme. Erst beim Lesen fliegt `InstantiationException: No default constructor for entity`. Ein Test ohne `flush`/`clear` liest aus dem Speicher und bemerkt den Fehler nicht.

- id: jpa-constructors-lists
  unit: jpa/konstruktoren
  main:
    kind: template
    prompt: Kapsle die Liste der Bücher einer Filiale.
    template: |
      private List<Book> books = {{new ArrayList<>()}};

      public List<Book> getBooks() {
          return {{Collections.unmodifiableList(books)}};
      }

      public void {{addBook}}(Book book) {
          books.add(book);
      }
    redHerrings:
      - "null"
      - books
      - setBooks
    explanation: |
      Die Liste wird beim Feld angelegt (nie `null`), nach außen nur unveränderlich herausgegeben und über eine eigene Methode geändert. Gibt der Getter `books` direkt zurück, kann jeder die Liste an der Filiale vorbei ändern.
  followUps:
    - kind: single
      prompt: Kann ein Entity ein Record sein, z. B. `@Entity public record Book(@Id @GeneratedValue Long id, String title) {}`?
      options:
        - Ja, Records sind die kürzeste Schreibweise für Entities
        - Nein, Hibernate kann die Felder eines Records nicht setzen – `persist` scheitert an der `final` Id
        - Nur mit `AbstractPersistable`
      answer: 1
      explanation: |
        Die Felder eines Records sind `final`. Beim Speichern will Hibernate die erzeugte Id setzen und scheitert mit `Can not set final java.lang.Long field`. Records eignen sich für Value Objects und Rich Types.

- id: jpa-column-attributes
  unit: jpa/basisattribute
  main:
    kind: template
    prompt: "`title` hat höchstens 120 Zeichen und ist Pflicht, `price` hat 6 Stellen, davon 2 Nachkommastellen."
    template: |
      @Column({{length}} = 120, {{nullable}} = false)
      private String title;

      @Column({{precision}} = 6, {{scale}} = 2)
      private BigDecimal price;
    redHerrings:
      - size
      - "unique"
      - max
    explanation: |
      `length` gilt für Strings, `nullable = false` macht die Spalte `not null`. Bei `BigDecimal` ist `precision` die Gesamtzahl der Stellen und `scale` die Zahl der Nachkommastellen: höchstens `9999.99`.
  followUps:
    - kind: single
      prompt: Welche Spalte legt Hibernate für dieses Feld an?
      code: |
        @NotNull
        @Size(max = 30)
        private String nickName;
      options:
        - "`nick_name varchar(255)`"
        - "`nick_name varchar(30) not null`"
        - "`nick_name varchar(30)`, `@NotNull` wirkt nur in Java"
      answer: 1
      explanation: |
        Hibernate übernimmt die Bean-Validation-Annotationen in die Tabelle: `@NotNull` wird zu `not null`, `@Size(max = 30)` zu `varchar(30)`.

- id: jpa-column-when
  unit: jpa/basisattribute
  main:
    kind: single
    prompt: "`isbn` ist mit `@Column(unique = true)` markiert. Was passiert in einem `@DataJpaTest`?"
    code: |
      bookRepository.save(book("9783161484100"));
      bookRepository.save(book("9783161484100"));
    options:
      - Der zweite `save` wirft eine `DataIntegrityViolationException`
      - Beide `save` laufen durch, der Fehler kommt erst beim Flush
      - Beide Bücher werden gespeichert, `unique` wirkt nur in Java
    answer: 1
    explanation: |
      Mit der Standard-Id-Vergabe (Sequence) fügt Hibernate erst beim Flush in die Tabelle ein. Erst dann prüft die Datenbank `unique`. Im Test verwendest du deshalb `saveAndFlush`.
  followUps:
    - kind: single
      prompt: "`title` ist mit `@NotNull` markiert. Welche Exception wirft `bookRepository.saveAndFlush(book)` für ein Buch ohne Titel?"
      options:
        - "`jakarta.validation.ConstraintViolationException`"
        - "`DataIntegrityViolationException`"
        - "`NullPointerException`"
        - Keine, das Buch wird mit `null` gespeichert
      answer: 0
      explanation: |
        Bean Validation prüft das Objekt in Java, bevor Hibernate das `insert` abschickt. Die Datenbank sieht den Wert nie. Eine `DataIntegrityViolationException` käme von der Datenbank, z. B. bei `@Column(nullable = false)` ohne `@NotNull`.

- id: jpa-column-reserved
  unit: jpa/basisattribute
  main:
    kind: single
    prompt: Was passiert mit diesem Feld, wenn der erste Test startet?
    code: |
      @NotNull
      private Integer year;
    options:
      - Nichts, die Spalte heißt `year`
      - Das Anlegen der Tabelle scheitert mit einem Syntaxfehler, weil `year` ein reserviertes Wort ist
      - Hibernate nennt die Spalte automatisch `year_`
    answer: 1
    explanation: |
      `year` ist in H2 ein Schlüsselwort. Hibernate schreibt den Namen ungeschützt ins `create table`, und die Tests scheitern schon beim Start. Abhilfe: `@Column(name = "build_year")`.
  followUps:
    - kind: multi
      prompt: Welche Feldnamen brauchen in H2 einen eigenen Spaltennamen?
      options:
        - "`from`"
        - "`until`"
        - "`order`"
        - "`name`"
        - "`value`"
      answer: [0, 2, 4]
      explanation: |
        `from`, `order` und `value` sind reserviert. `until` und `name` sind in H2 erlaubt.

- id: jpa-repo-interface
  unit: jpa/repositories
  main:
    kind: template
    prompt: Lege das Repository für `Book` an (Id vom Typ `Long`).
    template: |
      public {{interface}} BookRepository extends {{JpaRepository}}<{{Book}}, {{Long}}> {
      }
    redHerrings:
      - class
      - Repository
      - long
      - BookRepositoryImpl
    explanation: |
      Ein Repository ist ein Interface. Die Typargumente sind das Entity und der Typ seiner Id. Die Implementierung erzeugt Spring beim Start.
  followUps:
    - kind: single
      prompt: Was liefert `findAll()` bei einem Repository, das nur `CrudRepository<Book, Long>` erweitert?
      options:
        - "`List<Book>`"
        - "`Iterable<Book>`"
        - "`Stream<Book>`"
        - "`Optional<Book>`"
      answer: 1
      explanation: |
        `CrudRepository.findAll()` liefert ein `Iterable`. `ListCrudRepository` und `JpaRepository` liefern eine `List`.

- id: jpa-repo-lifecycle
  unit: jpa/repositories
  main:
    kind: single
    prompt: Dieser Test ist grün, obwohl `title` mit `@Transient` markiert ist und gar nicht gespeichert wird. Warum?
    code: |
      Book saved = bookRepository.save(book);
      Book reread = bookRepository.findById(saved.getId()).orElseThrow();
      assertThat(reread.getTitle()).isEqualTo("Der Process");
    options:
      - "`findById` liefert dasselbe Objekt aus dem Persistence Context, die Datenbank wird nicht gefragt"
      - "`@DataJpaTest` rollt den Test zurück, bevor `findById` läuft"
      - "`save` speichert in einem `@DataJpaTest` nie wirklich"
    answer: 0
    explanation: |
      Hibernate merkt sich gespeicherte Objekte. Ohne `entityManager.flush()` und `entityManager.clear()` bekommt `findById` das Objekt aus dem Speicher – der Test vergleicht es mit sich selbst.
  followUps:
    - kind: template
      prompt: Ergänze die Zeilen, damit `findById` wirklich aus der Datenbank liest.
      template: |
        Book saved = bookRepository.save(book);
        entityManager.{{flush()}};
        entityManager.{{clear()}};
        Book reread = bookRepository.findById(saved.getId()).orElseThrow();
      redHerrings:
        - "close()"
        - "refresh()"
        - "commit()"
      explanation: |
        `flush()` schreibt die ausstehenden Änderungen in die Datenbank, `clear()` leert den Persistence Context. Die Reihenfolge ist wichtig: Nach `clear()` ohne `flush()` gingen die Änderungen verloren.
    - kind: single
      prompt: Ein Test speichert drei Bücher. Wie viele Bücher findet der nächste Test in derselben Klasse?
      options:
        - Drei
        - Keines, jeder Test in `@DataJpaTest` wird zurückgerollt
        - Das hängt von der Reihenfolge der Tests ab
      answer: 1
      explanation: |
        `@DataJpaTest` führt jeden Test in einer Transaktion aus und rollt sie am Ende zurück. Jeder Test beginnt mit leeren Tabellen.

- id: jpa-enums-ordinal
  unit: jpa/enums
  main:
    kind: single
    prompt: "`private Genre genre;` ohne Annotation, `enum Genre { FICTION, NON_FICTION, COMIC }`. Was steht für `COMIC` in der Datenbank?"
    options:
      - "`'COMIC'`"
      - "`2`"
      - "`'C'`"
      - "`3`"
    answer: 1
    explanation: |
      Ohne Annotation speichert JPA das Ordinal, also die Position ab 0: `FICTION` = 0, `NON_FICTION` = 1, `COMIC` = 2.
  followUps:
    - kind: single
      prompt: Jemand fügt `BIOGRAPHY` als ersten Wert in das Enum ein. Was passiert mit den gespeicherten Comics?
      options:
        - Nichts, Hibernate passt die Daten an
        - Sie werden beim Lesen zu `NON_FICTION`, weil `2` jetzt `NON_FICTION` ist
        - Das Lesen wirft eine Exception
      answer: 1
      explanation: |
        In der Datenbank steht weiterhin `2`. Nach dem Einfügen ist `2` aber `NON_FICTION`. Genau deshalb ist das Ordinal für die Prüfung „faulty“ und braucht eine Behandlung.

- id: jpa-enums-converter
  unit: jpa/enums
  main:
    kind: template
    prompt: Vervollständige den null-sicheren Converter, der `Genre` als Code speichert.
    template: |
      @Converter({{autoApply = true}})
      public class GenreConverter implements {{AttributeConverter<Genre, String>}} {

          @Override
          public String convertToDatabaseColumn(Genre genre) {
              return genre == null ? null : {{genre.getCode()}};
          }

          @Override
          public Genre convertToEntityAttribute(String code) {
              return code == null ? null : {{Genre.fromCode(code)}};
          }
      }
    redHerrings:
      - autoapply = true
      - AttributeConverter<String, Genre>
      - genre.ordinal()
      - Genre.valueOf(code)
    explanation: |
      Das erste Typargument ist der Java-Typ, das zweite der Datenbanktyp. `autoApply` schreibt sich mit großem `A` (im Cheat Sheet steht es falsch). `Genre.valueOf` würde den Namen erwarten (`"COMIC"`), nicht den Code (`"C"`).
  followUps:
    - kind: single
      prompt: Warum braucht der Converter die `null`-Prüfung?
      options:
        - Gar nicht, Hibernate ruft Converter nie mit `null` auf
        - Hibernate ruft den Converter auch für leere Werte mit `null` auf, in beide Richtungen
        - Nur, damit der Code kompiliert
      answer: 1
      explanation: |
        Für ein Buch ohne Genre ruft Hibernate `convertToDatabaseColumn(null)` auf, und beim Lesen einer leeren Spalte `convertToEntityAttribute(null)`. Ohne Prüfung fliegt eine Exception.
    - kind: single
      prompt: Was bewirkt `autoApply = true`?
      options:
        - Der Converter gilt für jedes Feld vom Typ `Genre`, ohne Annotation am Feld
        - Der Converter wird beim Start automatisch getestet
        - Hibernate erzeugt die Methode `fromCode` automatisch
      answer: 0
      explanation: |
        Mit `autoApply = true` reicht `private Genre genre;`. Ohne `autoApply` brauchst du am Feld `@Convert(converter = GenreConverter.class)`.

- id: jpa-enums-string
  unit: jpa/enums
  main:
    kind: single
    prompt: Was ist der Nachteil von `@Enumerated(EnumType.STRING)` gegenüber einem Converter mit Codes?
    options:
      - Es funktioniert nur mit H2
      - Laut Cheat Sheet kostet es Punkte, und Umbenennen eines Werts bricht die gespeicherten Daten
      - Es speichert weiterhin das Ordinal
    answer: 1
    explanation: |
      `STRING` speichert den Namen (`'COMIC'`). Die Reihenfolge ist dann egal, aber ein umbenannter Wert passt nicht mehr zu den Daten. Das Cheat Sheet sagt dazu „lose some points“ und empfiehlt einen null-sicheren Converter.
  followUps:
    - kind: single
      prompt: "Im `@DataJpaTest` scheitert jedes Einfügen eines Buchs mit „Check constraint invalid“, obwohl der Genre-Code stimmt. Was hilft, wenn du die H2-Version nicht ändern kannst?"
      options:
        - "`@Enumerated(EnumType.ORDINAL)`"
        - "`@AutoConfigureTestDatabase(replace = AutoConfigureTestDatabase.Replace.NONE)` an der Testklasse"
        - "`@Column(length = 1)` am Feld"
      answer: 1
      explanation: |
        Das ist ein Fehler in H2 2.4.240 bei `check (... in (...))`-Constraints. Mit `replace = NONE` verwendet der Test die normale H2-Konfiguration von Spring Boot, und der Fehler tritt nicht auf. `length` hilft nicht.

- id: jpa-embedded-basics
  unit: jpa/value-objects
  main:
    kind: single
    prompt: "`Branch` hat ein Feld `@Embedded private Address address;`, `Address` ist ein `@Embeddable` Record mit `street`, `zip`, `city`. Welche Tabellen gibt es?"
    options:
      - "`branches` und `address`"
      - "Nur `branches`, mit den Spalten `street`, `zip` und `city`"
      - "`branches` und eine Zwischentabelle `branches_address`"
    answer: 1
    explanation: |
      Ein eingebettetes Value Object hat keine eigene Tabelle. Seine Attribute werden zu Spalten in der Tabelle des Entities.
  followUps:
    - kind: single
      prompt: Im Record steht `@Size(max = 64) String street`, die Spalte ist aber `varchar(255)`. Was fehlt?
      options:
        - "`@Valid` am Feld `address` im Entity"
        - "`@Column(length = 64)` am Record"
        - "`@Entity` am Record"
      answer: 0
      explanation: |
        Ohne `@Valid` schaut Hibernate nicht in das Value Object hinein – weder für die Spaltenlänge noch für die Prüfung beim Speichern.

- id: jpa-embedded-twice
  unit: jpa/value-objects
  main:
    kind: single
    prompt: Ein Entity hat `@Embedded Address homeAddress;` und `@Embedded Address billingAddress;`, sonst nichts. Was passiert?
    options:
      - Hibernate nennt die Spalten automatisch `home_address_street` usw.
      - Der Start scheitert mit `Column 'street' is duplicated`
      - Die zweite Adresse überschreibt die erste
    answer: 1
    explanation: |
      Beide Adressen wollen die Spalten `street`, `zip` und `city`. Du musst sie umbenennen: mit `@EmbeddedColumnNaming` oder `@AttributeOverrides`.
  followUps:
    - kind: template
      prompt: Gib allen Spalten der Wohnadresse das Präfix `home_`.
      template: |
        @{{Embedded}}
        @{{EmbeddedColumnNaming}}("{{home_%s}}")
        private Address homeAddress;
      redHerrings:
        - home_
        - "%s_home"
        - Embeddable
      explanation: |
        Der Wert ist ein Format-Muster, `%s` steht für den ursprünglichen Spaltennamen: `home_street`, `home_zip`, `home_city`. Im Cheat Sheet fehlt das `%s`.
    - kind: template
      prompt: Benenne die Spalte `street` der Rechnungsadresse in `billing_street` um.
      template: |
        @Embedded
        @AttributeOverrides({
                @AttributeOverride({{name}} = "street", {{column}} = @Column(name = "billing_street"))
        })
        private Address billingAddress;
      redHerrings:
        - field
        - value
      explanation: |
        `name` ist das Attribut im Value Object, `column` die neue Spalte. Für `zip` und `city` brauchst du je einen weiteren `@AttributeOverride`.

- id: jpa-embedded-record
  unit: jpa/value-objects
  main:
    kind: multi
    prompt: Was stimmt für ein Value Object als `@Embeddable` Record?
    options:
      - Es braucht keine Id
      - Es braucht keinen Konstruktor ohne Parameter
      - "`equals` und `hashCode` vergleichen alle Werte"
      - Es braucht ein eigenes Repository
    answer: [0, 1, 2]
    explanation: |
      Value Objects haben keine Identität und kein Repository. Records erzeugen `equals` und `hashCode` über alle Attribute, und Hibernate kann sie über den kanonischen Konstruktor erzeugen. Eine **Klasse** als `@Embeddable` bräuchte einen Konstruktor ohne Parameter.

- id: jpa-richtype-converter
  unit: jpa/rich-types
  main:
    kind: single
    prompt: Ein `«RichType»` `RoomName` hat die Teile `building`, `floor` und `roomNumber`. Wie bildest du ihn auf **eine** Spalte ab?
    options:
      - "`@Embeddable` und `@Embedded`"
      - Ein `AttributeConverter<RoomName, String>`, der `shortName()` speichert und mit `fromShortName(...)` liest
      - Drei Felder im Entity
    answer: 1
    explanation: |
      Mit `@Embeddable` gäbe es drei Spalten – das wäre ein Value Object. Der Converter setzt die Teile zu einem String zusammen (`B307`) und zerlegt ihn beim Lesen wieder.
  followUps:
    - kind: template
      prompt: Vervollständige den Converter für `RoomName`.
      template: |
        @Converter(autoApply = true)
        public class RoomNameConverter implements AttributeConverter<RoomName, String> {

            @Override
            public String {{convertToDatabaseColumn}}(RoomName roomName) {
                return roomName == null ? null : {{roomName.shortName()}};
            }

            @Override
            public RoomName {{convertToEntityAttribute}}(String shortName) {
                return shortName == null ? null : {{RoomName.fromShortName(shortName)}};
            }
        }
      redHerrings:
        - roomName.toString()
        - new RoomName(shortName)
      explanation: |
        `convertToDatabaseColumn` geht von Java in die Datenbank, `convertToEntityAttribute` zurück. `toString()` eines Records liefert `RoomName[building=B, ...]`, nicht `B307`.

- id: jpa-richtype-validation
  unit: jpa/rich-types
  main:
    kind: single
    prompt: Wo prüfst du die Regeln eines Rich Types, z. B. „die ISBN hat genau 13 Ziffern“?
    options:
      - Im kompakten Konstruktor des Records – dann kann es keine ungültige ISBN geben
      - Im Converter, nur beim Speichern
      - Im Repository-Test
    answer: 0
    explanation: |
      Der kompakte Konstruktor läuft bei jedem `new Isbn(...)`, auch beim Lesen über den Converter. Ein ungültiger Wert wirft sofort eine `IllegalArgumentException`.
  followUps:
    - kind: multi
      prompt: "Regeln: `building` ∈ {A, B, C, D}, `floor` ∈ {E, H, 1–5}, `roomNumber` zwei Ziffern. Welche Aufrufe von `RoomName.fromShortName` müssen eine Exception werfen?"
      options:
        - "`\"B307\"`"
        - "`\"E307\"`"
        - "`\"B607\"`"
        - "`\"AE01\"`"
        - "`\"B37\"`"
      answer: [1, 2, 4]
      explanation: |
        `E` ist kein Gebäude, `6` kein Stockwerk, und `B37` hat nur eine Ziffer als Raumnummer. `B307` und `AE01` sind gültig.

- id: jpa-manytoone-column
  unit: jpa/many-to-one
  main:
    kind: single
    prompt: Welche Spalte legt Hibernate in `books` an?
    code: |
      @Entity
      @Table(name = "books")
      public class Book extends AbstractPersistable<Long> {
          @ManyToOne
          private Branch branch;
      }
    options:
      - "`branch varchar(255)`"
      - "`branch_id bigint` mit einem Fremdschlüssel auf `branches`"
      - Keine, Hibernate legt eine Zwischentabelle an
    answer: 1
    explanation: |
      Ein `@ManyToOne` wird zu einer Fremdschlüssel-Spalte `<feld>_id`. Den Namen des Constraints erzeugt Hibernate selbst, z. B. `FKkbcx...`.
  followUps:
    - kind: template
      prompt: "Jedes Buch **muss** eine Filiale haben, und der Fremdschlüssel soll `fk_books_branch` heißen."
      template: |
        @ManyToOne
        @{{JoinColumn}}(name = "branch_id", {{nullable = false}},
                foreignKey = @{{ForeignKey}}(name = "fk_books_branch"))
        private Branch branch;
      redHerrings:
        - Column
        - optional = true
        - UniqueConstraint
      explanation: |
        `@JoinColumn` beschreibt die Fremdschlüssel-Spalte, `nullable = false` macht sie zur Pflicht, `@ForeignKey` benennt den Constraint. Sprechende Namen statt generierter sind ein Kriterium für „Sehr gut“.

- id: jpa-manytoone-transient
  unit: jpa/many-to-one
  main:
    kind: single
    prompt: Was passiert beim Flush?
    code: |
      Branch branch = new Branch("Hauptbücherei", address);
      bookRepository.save(new Book(isbn, "Der Process", Genre.FICTION, price, publishedOn, branch));
      entityManager.flush();
    options:
      - Buch und Filiale werden gespeichert
      - "`TransientPropertyValueException`: Das Buch verweist auf eine noch nicht gespeicherte Filiale"
      - Das Buch wird ohne Filiale gespeichert
    answer: 1
    explanation: |
      Die Filiale ist neu (*transient*). Ohne Cascade speichert Hibernate sie nicht mit und weigert sich, einen Fremdschlüssel auf etwas Ungespeichertes zu schreiben.
  followUps:
    - kind: multi
      prompt: Wie behebst du das?
      options:
        - Die Filiale zuerst mit `branchRepository.save(branch)` speichern
        - "`@ManyToOne(cascade = CascadeType.PERSIST)` am Feld `branch`"
        - "`@ManyToOne(fetch = FetchType.LAZY)` am Feld `branch`"
        - "`entityManager.clear()` vor dem Flush"
      answer: [0, 1]
      explanation: |
        Entweder speicherst du die Filiale selbst zuerst, oder Cascade `PERSIST` gibt das Speichern vom Buch an die Filiale weiter. `LAZY` betrifft nur das Laden, `clear()` würde das Buch verwerfen.

- id: jpa-onetomany-mappedby
  unit: jpa/one-to-many
  main:
    kind: single
    prompt: "`Book` hat `@ManyToOne private Branch branch;`. Was bewirkt `mappedBy` in `Branch`?"
    code: |
      @OneToMany(mappedBy = "branch")
      private List<Book> books = new ArrayList<>();
    options:
      - Die Liste ist dieselbe Beziehung wie `Book.branch`, der Fremdschlüssel bleibt `branch_id` in `books`
      - Hibernate legt eine Zwischentabelle `branches_books` an
      - Die Liste wird in einer Spalte `books` in `branches` gespeichert
    answer: 0
    explanation: |
      `mappedBy` verweist auf das Feld der besitzenden Seite. Ohne `mappedBy` entstünde eine zweite, unabhängige Beziehung mit Zwischentabelle `branches_books`.
  followUps:
    - kind: single
      prompt: "Du rufst nur `books.add(book)` auf (ohne `book.setBranch(...)`) und speicherst die Filiale mit Cascade. `branch_id` darf `null` sein. Was steht danach in `books.branch_id`?"
      options:
        - Die Id der Filiale
        - "`null`"
        - Hibernate wirft eine Exception, weil die Liste nicht passt
      answer: 1
      explanation: |
        Hibernate speichert nur, was auf der besitzenden Seite (`Book.branch`) steht. Die Liste mit `mappedBy` ist die Gegenseite und wird beim Speichern ignoriert.

- id: jpa-onetomany-helpers
  unit: jpa/one-to-many
  main:
    kind: template
    prompt: Die Hilfsmethode soll beide Seiten der Beziehung setzen.
    template: |
      public void addBook(Book book) {
          {{books.add(book)}};
          {{book.setBranch(this)}};
      }
    redHerrings:
      - book.setBranch(null)
      - books.remove(book)
      - this.branch = book
    explanation: |
      `books.add(book)` hält die Gegenseite in Java aktuell, `book.setBranch(this)` setzt die besitzende Seite, die Hibernate speichert. Fehlt eine der beiden Zeilen, passen Java-Objekte und Datenbank nicht zusammen.
  followUps:
    - kind: single
      prompt: Was bewirkt `orphanRemoval = true` an `@OneToMany(mappedBy = "branch", ...)`?
      options:
        - Ein Buch, das mit `removeBook` aus der Liste entfernt wird, wird gelöscht
        - Eine Filiale ohne Bücher wird gelöscht
        - Bücher ohne Filiale dürfen nicht gespeichert werden
      answer: 0
      explanation: |
        Ein „Waise“ ist ein Kind, das seinen Elternteil verloren hat. Mit `orphanRemoval` löscht Hibernate es beim nächsten Flush.

- id: jpa-manytomany-jointable
  unit: jpa/many-to-many
  main:
    kind: single
    prompt: "`Book \"n\" -- \"n\" Author`: Wo speichert die Datenbank, welche Autoren ein Buch hat?"
    options:
      - In einer Spalte `author_id` in `books`
      - In einer Spalte `book_id` in `authors`
      - In einer Zwischentabelle mit den Spalten `book_id` und `author_id`
      - In einer Textspalte mit allen Ids, getrennt durch Kommas
    answer: 2
    explanation: |
      Eine Fremdschlüssel-Spalte kann nur auf **eine** Zeile zeigen. Für n:m braucht es eine Zwischentabelle mit zwei Fremdschlüsseln. Mit `@JoinTable(name = "book_authors", joinColumns = …, inverseJoinColumns = …)` legst du ihre Namen fest.
  followUps:
    - kind: single
      prompt: "In `@JoinTable(name = \"book_authors\", joinColumns = @JoinColumn(name = \"book_id\"), inverseJoinColumns = @JoinColumn(name = \"author_id\"))` an `Book.authors`: Worauf zeigt `book_id`?"
      options:
        - Auf `books`, die Klasse mit dem Feld
        - Auf `authors`, die Klasse in der Menge
        - Auf die Zwischentabelle selbst
      answer: 0
      explanation: |
        `joinColumns` zeigt auf die **eigene** Klasse (die mit `@JoinTable`), `inverseJoinColumns` auf die andere Seite.
    - kind: single
      prompt: "`authors` ist ein `Set<Author>`. Was ist der Primary Key von `book_authors`?"
      options:
        - Es gibt keinen
        - Das Paar `(author_id, book_id)`
        - Eine eigene Spalte `id`
      answer: 1
      explanation: |
        Bei einem `Set` macht Hibernate das Paar zum Primary Key – dieselbe Verbindung kann es nur einmal geben. Bei einer `List` gibt es keinen Primary Key.

- id: jpa-manytomany-owning
  unit: jpa/many-to-many
  main:
    kind: single
    prompt: "`Book.authors` hat `@JoinTable`, `Author.books` hat `@ManyToMany(mappedBy = \"authors\")`. Eine Methode in `Author` fügt das Buch nur in `this.books` ein, `book.authors` bleibt unverändert. Was steht nach dem Speichern in `book_authors`?"
    options:
      - Eine neue Zeile für Buch und Autorin
      - Nichts – Hibernate speichert nur die besitzende Seite `Book.authors`
      - Hibernate wirft eine Exception, weil die Seiten nicht übereinstimmen
    answer: 1
    explanation: |
      Die Seite mit `mappedBy` ist die Gegenseite. Was nur dort steht, ignoriert Hibernate beim Speichern. Deshalb ändert man die Beziehung über Hilfsmethoden wie `book.addAuthor(author)`, die beide Seiten setzen.
  followUps:
    - kind: multi
      prompt: Was spricht bei `@ManyToMany` für `Set` statt `List`?
      options:
        - Die Zwischentabelle bekommt einen Primary Key
        - Beim Entfernen eines Elements löscht Hibernate genau eine Zeile statt alle
        - Die Reihenfolge bleibt beim Lesen erhalten
        - Man braucht keine Hilfsmethoden mehr
      answer: [0, 1]
      explanation: |
        Mit `List` löscht Hibernate beim Entfernen alle Zeilen des Besitzers und schreibt die übrigen neu, und doppelte Verbindungen sind möglich. Die Reihenfolge bleibt bei beiden nicht erhalten, und Hilfsmethoden brauchst du immer.
    - kind: single
      prompt: Warum ist `cascade = CascadeType.REMOVE` an `Book.authors` gefährlich?
      options:
        - Weil Hibernate es bei `@ManyToMany` nicht unterstützt
        - Weil das Löschen eines Buchs dann Autoren löscht, die auch andere Bücher geschrieben haben
        - Weil dann die Zwischentabelle nicht mehr angelegt wird
      answer: 1
      explanation: |
        Bei n:m gehört die andere Seite nicht einem einzelnen Objekt. Cascade REMOVE würde geteilte Autoren mitlöschen.

- id: jpa-onetoone-unique
  unit: jpa/one-to-one
  main:
    kind: single
    prompt: "`Member` hat `@OneToOne @JoinColumn(name = \"card_id\") private LibraryCard card;`. Was unterscheidet die Spalte `card_id` von einer `@ManyToOne`-Spalte?"
    options:
      - Sie ist `unique`
      - Sie ist automatisch `not null`
      - Sie liegt in der Tabelle `library_cards`
      - Nichts
    answer: 0
    explanation: |
      `@OneToOne` erzeugt denselben Fremdschlüssel wie `@ManyToOne`, aber mit `unique`. Zwei Mitglieder mit demselben Ausweis lehnt die Datenbank ab.
  followUps:
    - kind: single
      prompt: "`Member --> \"1\" Address`, und `Address` ist ein `«ValueObject»`. Welche Umsetzung ist richtig?"
      options:
        - "`@OneToOne` mit einer Tabelle `addresses`"
        - "`@Embedded` mit den Spalten in `members`"
        - "`@ManyToOne` mit `unique = true`"
      answer: 1
      explanation: |
        Ein Value Object hat keine Id und keine Tabelle – auch bei Multiplizität 1 ist es `@Embedded`. `@OneToOne` verbindet zwei Entities.

- id: jpa-onetoone-mappedby
  unit: jpa/one-to-one
  main:
    kind: single
    prompt: "Der Ausweis soll sein Mitglied kennen. Welche Annotation bekommt `LibraryCard.member`?"
    options:
      - "`@OneToOne(mappedBy = \"card\")`"
      - "`@OneToOne @JoinColumn(name = \"member_id\")`"
      - "`@ManyToOne(mappedBy = \"card\")`"
    answer: 0
    explanation: |
      Der Fremdschlüssel liegt schon in `members.card_id`. Die Gegenseite verweist mit `mappedBy` auf das Feld `card`. Ein zweites `@JoinColumn` würde eine zweite, unabhängige Beziehung anlegen.
  followUps:
    - kind: single
      prompt: "Welche Hilfsmethode hält beide Seiten synchron?"
      code: |
        // A
        public void setCard(LibraryCard card) {
            this.card = card;
        }

        // B
        public void setCard(LibraryCard card) {
            this.card = card;
            card.setMember(this);
        }
      options:
        - A
        - B
      answer: 1
      explanation: |
        Wie bei `@OneToMany`: Die Hilfsmethode setzt die besitzende Seite (`card`) **und** die Gegenseite (`member`).

- id: jpa-elementcollection-basics
  unit: jpa/element-collection
  main:
    kind: single
    prompt: "`Book` hat `keywords : Set<String>`. Wie setzt du das um?"
    options:
      - "`@OneToMany` auf ein neues Entity `Keyword`"
      - "`@ElementCollection` mit `@CollectionTable(name = \"book_keywords\", …)`"
      - "`@Embedded`"
      - Gar nicht, Mengen von Strings lassen sich nicht speichern
    answer: 1
    explanation: |
      Eine Menge einfacher Werte ist eine Element Collection. Sie bekommt eine eigene Tabelle mit Fremdschlüssel auf `books`, aber kein Entity und kein Repository.
  followUps:
    - kind: multi
      prompt: Was stimmt für Elemente einer `@ElementCollection`?
      options:
        - Sie haben keine eigene Id
        - Sie werden immer mit dem Entity gespeichert und gelöscht
        - Sie brauchen ein eigenes Repository
        - Sie können `@Embeddable`s sein
      answer: [0, 1, 3]
      explanation: |
        Elemente gehören ganz zum Entity: keine Id, kein Repository, Speichern und Löschen gehen immer mit. Erlaubt sind einfache Typen und `@Embeddable`s.

- id: jpa-elementcollection-list
  unit: jpa/element-collection
  main:
    kind: single
    prompt: "Eine Filiale hat 7 Öffnungszeiten in einer `List<OpeningHours>` (`@ElementCollection`). Du entfernst eine. Welche SQL-Befehle schickt Hibernate?"
    options:
      - "Ein `delete` für genau diese Zeile"
      - "Ein `delete` aller 7 Zeilen der Filiale und 6 `insert`s"
      - "Ein `update`, das die Zeile auf `null` setzt"
    answer: 1
    explanation: |
      Die Elemente haben keine Id, an der Hibernate die eine Zeile erkennen könnte. Bei einer `List` schreibt es die ganze Sammlung neu.
  followUps:
    - kind: single
      prompt: "Warum heißt das Feld in `OpeningHours` `weekday` und nicht `day`?"
      options:
        - "`day` ist in H2 ein reserviertes Wort, die Tabelle ließe sich nicht anlegen"
        - "`day` ist in Java ein Schlüsselwort"
        - Nur aus Geschmack
      answer: 0
      explanation: |
        `create table opening_hours (… day tinyint …)` scheitert in H2 mit einem Syntaxfehler. Weitere reservierte Wörter: `year`, `month`, `from`, `to`, `order`, `user`, `value`, `key` (Einheit 4).

- id: jpa-inheritance-singletable
  unit: jpa/vererbung
  main:
    kind: single
    prompt: "`Reading` und `Workshop` erben von `@Entity abstract class LibraryEvent`, ohne `@Inheritance`. Welche Tabellen entstehen?"
    options:
      - Eine Tabelle für alle drei Klassen, mit einer Spalte `dtype`
      - Je eine Tabelle für `Reading` und `Workshop`
      - Drei Tabellen, verbunden über die Id
    answer: 0
    explanation: |
      Der Default ist `SINGLE_TABLE`: alle Felder aller Unterklassen in einer Tabelle. Die Spalte `dtype` sagt, welche Klasse eine Zeile ist.
  followUps:
    - kind: single
      prompt: "`Reading.authorName` hat `@Column(nullable = false)`. Was passiert beim Speichern eines `Workshop`?"
      options:
        - Nichts Besonderes
        - "Die Datenbank lehnt ihn ab, weil `author_name` `not null` ist"
        - Hibernate setzt `author_name` auf einen leeren String
      answer: 1
      explanation: |
        Bei `SINGLE_TABLE` teilen sich alle Unterklassen die Spalten. Ein `not null` für eine Unterklasse gilt für alle. Nimm `@NotNull` (Bean Validation) statt `nullable = false`.
    - kind: single
      prompt: "`libraryEventRepository.findAll()` nach dem Speichern einer Lesung und eines Workshops liefert …"
      options:
        - zwei Objekte vom Typ `LibraryEvent`
        - ein `Reading` und ein `Workshop`
        - nichts, weil `LibraryEvent` abstrakt ist
      answer: 1
      explanation: |
        Abfragen über die Oberklasse sind polymorph: Hibernate liest `dtype` und erzeugt jeweils die richtige Unterklasse.

- id: jpa-inheritance-strategies
  unit: jpa/vererbung
  main:
    kind: single
    prompt: Bei welcher Strategie hat jede Klasse der Hierarchie eine eigene Tabelle, und die Unterklassen verweisen über ihre Id auf die Oberklasse?
    options:
      - "`SINGLE_TABLE`"
      - "`JOINED`"
      - "`TABLE_PER_CLASS`"
    answer: 1
    explanation: |
      `JOINED`: eine Tabelle pro Klasse, beim Lesen werden sie über die Id gejoint. `TABLE_PER_CLASS` hat nur Tabellen für konkrete Klassen, jeweils mit allen geerbten Spalten.
  followUps:
    - kind: single
      prompt: "Wofür ist `@MappedSuperclass`?"
      options:
        - Für eine Oberklasse mit gemeinsamen Feldern, die selbst kein Entity ist und keine Tabelle hat
        - Für die Oberklasse bei `SINGLE_TABLE`
        - Für Value Objects mit Vererbung
      answer: 0
      explanation: |
        Die Felder landen in den Tabellen der Unterklassen. Über eine `@MappedSuperclass` kann man nicht abfragen. `AbstractPersistable` ist genau so eine Klasse.

- id: jpa-graph-flush-clear
  unit: jpa/objektgraphen-testen
  main:
    kind: single
    prompt: Ein Test speichert eine Filiale mit zwei Büchern und liest sie sofort mit `findById` – **ohne** `flush`/`clear`. Warum beweist das wenig?
    options:
      - "`findById` liefert dasselbe Objekt aus dem First-Level-Cache, die Datenbank wird gar nicht gelesen"
      - "`findById` findet ohne `flush` nichts"
      - Weil `save` ohne `flush` eine Exception wirft
    answer: 0
    explanation: |
      Ohne `clear` gibt Hibernate das Objekt aus dem Speicher zurück – samt der Liste, die du selbst befüllt hast. Erst nach `flush` und `clear` wird wirklich aus der Datenbank gelesen.
  followUps:
    - kind: single
      prompt: "Was macht `entityManager.persistFlushFind(author)`?"
      options:
        - Speichern, in die Datenbank schreiben, Cache leeren und neu lesen
        - Nur speichern
        - Den Autor suchen und, wenn er fehlt, speichern
      answer: 0
      explanation: |
        Die drei Schritte in einem Aufruf – praktisch für Testdaten und schnelle Lifecycle-Tests.

- id: jpa-graph-lazy
  unit: jpa/objektgraphen-testen
  main:
    kind: single
    prompt: "Ein Test läuft mit `@Transactional(propagation = NOT_SUPPORTED)`. Nach `branchRepository.findById(id)` ruft er `branch.getBooks().size()` auf. Was passiert?"
    options:
      - Die Bücher werden nachgeladen
      - "`LazyInitializationException`, weil keine Session mehr offen ist"
      - Die Liste ist leer
    answer: 1
    explanation: |
      `@OneToMany` lädt lazy. Ohne Transaktion ist die Session nach `findById` geschlossen. Im normalen `@DataJpaTest` läuft jeder Test in einer Transaktion, dann klappt es. Sonst hilft eine Abfrage mit `join fetch`.
  followUps:
    - kind: multi
      prompt: Was gehört zu einem vollständigen Testsatz für die Angabe?
      options:
        - Speichern und Lesen jedes Entities
        - Je ein Test für jede Beziehung, in jede Richtung des Modells
        - Ein Test, dass ungültige Daten abgelehnt werden
        - Tests für jede Getter-Methode
      answer: [0, 1, 2]
      explanation: |
        Entities, Beziehungen und Constraints müssen getestet sein – ungetestete Klassen zählen nicht. Getter einzeln zu testen bringt nichts, sie werden in den anderen Tests mitbenutzt.

- id: jpa-derived-keywords
  unit: jpa/abgeleitete-queries
  main:
    kind: single
    prompt: "„Alle Personen mit Nachname ‚Schmidt‘, unabhängig von der Groß-/Kleinschreibung.“ Welche Methode im `PersonRepository`?"
    options:
      - "`List<Person> findByLastNameIgnoreCase(String lastName);`"
      - "`List<Person> findByLastNameContaining(String lastName);`"
      - "`List<Person> findByLast_NameIgnoreCase(String lastName);`"
      - "`List<Person> findAllSchmidt();`"
    answer: 0
    explanation: |
      `IgnoreCase` vergleicht mit `upper(last_name) = upper(?)`. Der Name verwendet das Java-Feld `lastName`, nicht die Spalte `last_name`. `Containing` würde auch „Schmidtbauer“ finden.
  followUps:
    - kind: single
      prompt: "Welche Methode findet alle Bücher einer Filiale in einer bestimmten Stadt? (`Book.branch` → `Branch.address` → `Address.city`)"
      options:
        - "`findByCity(String city)`"
        - "`findByBranchAddressCity(String city)`"
        - "`findByBranch_City(String city)`"
      answer: 1
      explanation: |
        Der Name folgt dem Pfad über die Beziehung und das Value Object: `branch.address.city`. Spring Data erzeugt den Join selbst.
    - kind: single
      prompt: "`Optional<Book> findByPriceLessThan(BigDecimal max)` findet zwei Bücher. Was passiert?"
      options:
        - Es liefert das erste
        - Es liefert `Optional.empty()`
        - "`IncorrectResultSizeDataAccessException`"
      answer: 2
      explanation: |
        `Optional` heißt „höchstens ein Treffer“. Bei mehreren wirft Spring Data eine Exception. Für mehrere nimm `List<Book>`, für den ersten `findFirstBy…`.

- id: jpa-derived-errors
  unit: jpa/abgeleitete-queries
  main:
    kind: single
    prompt: "Im Repository steht `List<Book> findByTitel(String t);`. Was passiert?"
    options:
      - Die Methode liefert immer eine leere Liste
      - Der Spring-Kontext startet nicht – jeder Test scheitert mit `No property 'titel' found for type 'Book'`
      - Nur Tests, die die Methode aufrufen, scheitern
    answer: 1
    explanation: |
      Spring Data prüft alle Methodennamen beim Start. Ein Tippfehler bricht den Start ab – die Meldung schlägt sogar `title` vor.
  followUps:
    - kind: single
      prompt: "Ein Test für `findByTitleContainingIgnoreCase(\"MOHN\")` speichert nur das Buch „Mohn und Gedächtnis“. Was fehlt?"
      options:
        - Nichts
        - Ein Buch, das **nicht** gefunden werden darf
        - Ein Test mit `null`
      answer: 1
      explanation: |
        Mit nur einem passenden Buch würde auch eine Methode bestehen, die alles liefert. Testdaten müssen Treffer auch ausschließen.

- id: jpa-jpql-basics
  unit: jpa/jpql
  main:
    kind: single
    prompt: Welche `@Query` ist gültiges JPQL für „Bücher einer Autorin“?
    options:
      - "`select * from books b join book_authors ba on ba.book_id = b.id where ba.author_name = :name`"
      - "`select b from Book b join b.authors a where a.name = :name`"
      - "`select b from books b where b.authors.name = :name`"
    answer: 1
    explanation: |
      JPQL arbeitet mit Entities (`Book`) und Feldern (`b.authors`), nicht mit Tabellen. Der Join folgt dem Feld der Beziehung. `select *` gibt es in JPQL nicht.
  followUps:
    - kind: single
      prompt: "Was passiert bei `@Query(\"select b from books b\")`?"
      options:
        - Die Abfrage liefert alle Bücher
        - "Der Kontext startet nicht: `Could not resolve root entity 'books'`"
        - Erst der Aufruf scheitert
      answer: 1
      explanation: |
        JPQL-Abfragen werden beim Start geprüft. `books` ist der Tabellenname, das Entity heißt `Book`.
    - kind: single
      prompt: "Wodurch unterscheidet sich `nativeQuery = true`?"
      options:
        - Es ist echtes SQL mit Tabellen- und Spaltennamen und wird nicht beim Start geprüft
        - Es ist schneller und deshalb immer vorzuziehen
        - Es erlaubt Parameter, JPQL nicht
      answer: 0
      explanation: |
        Native Queries hängen an der Datenbank und fallen erst beim Aufruf auf. Nimm sie nur, wenn JPQL nicht reicht.

- id: jpa-jpql-fetch
  unit: jpa/jpql
  main:
    kind: single
    prompt: "Wozu dient `select b from Book b left join fetch b.authors where b.isbn = :isbn`?"
    options:
      - Es lädt das Buch und seine Autoren in einer Abfrage
      - Es lädt nur Bücher, die Autoren haben
      - Es speichert die Autoren mit
    answer: 0
    explanation: |
      `fetch` füllt die Lazy-Liste gleich mit. `left` behält auch Bücher ohne Autoren.
  followUps:
    - kind: single
      prompt: "`@Query(\"select b from Book b where b.price <= :max\") List<Book> cheap(BigDecimal max);` – woher weiß Spring, dass `:max` der Parameter `max` ist?"
      options:
        - Über den Parameternamen; das Gradle-Plugin kompiliert mit `-parameters`. Sicher geht es mit `@Param("max")`
        - Über die Position, der erste Parameter ist immer `:max`
        - Gar nicht, man muss `?1` schreiben
      answer: 0
      explanation: |
        Ohne `-parameters` sind die Namen zur Laufzeit unbekannt. `@Param` macht die Zuordnung unabhängig davon.

- id: jpa-projection-constructor
  unit: jpa/projektionen
  main:
    kind: single
    prompt: "`record BookOverview(String title, String branchName, BigDecimal price)` liegt in `ormapping.persistence`. Welche Abfrage füllt ihn?"
    options:
      - "`select new BookOverview(b.title, b.branch.name, b.price) from Book b`"
      - "`select new ormapping.persistence.BookOverview(b.title, b.branch.name, b.price) from Book b`"
      - "`select BookOverview(b) from Book b`"
    answer: 1
    explanation: |
      Der Konstruktor-Ausdruck braucht den Klassennamen mit Package. Ohne Package scheitert der Start mit `Could not resolve class 'BookOverview' named for instantiation`.
  followUps:
    - kind: single
      prompt: "Raumnummer aus `building`, `level` und `roomNo` als **ein** Attribut, z. B. `\"C.3.07\"`. Welcher Ausdruck?"
      options:
        - "`concat(r.building, '.', r.level, '.', r.roomNo)`"
        - "`r.building + '.' + r.level + '.' + r.roomNo`"
        - "`format(r.building, r.level, r.roomNo)`"
      answer: 0
      explanation: |
        `concat` nimmt beliebig viele Argumente. `||` geht auch, `+` verbindet in JPQL keine Texte.

- id: jpa-projection-aggregate
  unit: jpa/projektionen
  main:
    kind: single
    prompt: "`select br.name, count(b), sum(b.price) from Branch br left join br.books b group by br.name` – was liefert eine Filiale ohne Bücher?"
    options:
      - "Sie fehlt im Ergebnis"
      - "`count` = 0 und `sum` = `null`"
      - "`count` = 0 und `sum` = 0"
    answer: 1
    explanation: |
      `left join` behält die Filiale. `count` zählt keine Bücher (0), `sum` über nichts ist in SQL `null`. Mit `coalesce(sum(b.price), 0)` wird daraus 0.
  followUps:
    - kind: single
      prompt: "Welchen Java-Typ liefert `count(…)`?"
      options:
        - "`Integer`"
        - "`Long`"
        - "`BigDecimal`"
      answer: 1
      explanation: |
        `count` liefert immer `Long`. Im Record kannst du `long` oder `Long` verwenden. `sum` über `Integer` liefert ebenfalls `Long`, `avg` liefert `Double`.
    - kind: single
      prompt: "Ein Test erwartet `new BranchStock(\"HB\", 2, new BigDecimal(\"40.4\"))`, die Abfrage liefert `totalValue = 40.40`. Warum scheitert `containsExactly`?"
      options:
        - "`BigDecimal.equals` vergleicht auch die Scale: `40.4` ist nicht gleich `40.40`"
        - Records haben kein `equals`
        - "`count` ist `Long`, im Record steht `long`"
      answer: 0
      explanation: |
        Die Datenbank liefert die Scale der Spalte (`numeric(38,2)`). Schreib den erwarteten Wert mit derselben Scale oder vergleiche mit `isEqualByComparingTo`.
