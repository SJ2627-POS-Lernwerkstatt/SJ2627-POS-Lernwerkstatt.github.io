- id: fundament-objekte-new
  unit: fundament/klassen-objekte
  main:
    kind: single
    prompt: "Wie viele `Book`-Objekte gibt es nach diesem Code?"
    code: |
      Book a = new Book();
      Book b = new Book();
      Book c = a;
      Book d = null;
    options:
      - "2"
      - "3"
      - "4"
      - "1"
    answer: 0
    explanation: |
      Nur `new` baut ein Objekt – zweimal `new`, also zwei Bücher. `c = a` kopiert den **Zeiger**: `c` und `a` zeigen
      auf dasselbe Buch. `d` zeigt auf gar nichts (`null`).
  followUps:
    - kind: single
      prompt: "Was gibt die letzte Zeile aus?"
      code: |
        Book a = new Book();
        a.pages = 100;
        Book c = a;
        c.pages = 200;
        System.out.println(a.pages);
      options:
        - "200"
        - "100"
        - "0"
        - "Kompilierfehler"
      answer: 0
      explanation: |
        `a` und `c` zeigen auf **dasselbe** Objekt. Eine Änderung über `c` sieht man auch über `a`.

- id: fundament-objekte-static
  unit: fundament/klassen-objekte
  main:
    kind: single
    prompt: "Welcher Aufruf kompiliert?"
    code: |
      public class Book {
          String title;
          static boolean isValidIsbn(String isbn) { return isbn.length() == 13; }
          int titleLength() { return title.length(); }
      }
    options:
      - "`Book.isValidIsbn(\"9783608938289\")`"
      - "`Book.titleLength()`"
      - "`Book.title`"
      - "`new Book().isValidIsbn` ohne Klammern"
    answer: 0
    explanation: |
      `static`-Methoden gehören der Klasse und werden über den Klassennamen aufgerufen. `titleLength()` und `title`
      gehören einem **konkreten** Buch – dafür brauchst du ein Objekt, z. B. `new Book().titleLength()`.
  followUps:
    - kind: single
      prompt: "Warum meldet der Compiler hier *non-static variable title cannot be referenced from a static context*?"
      code: |
        public class Book {
            String title;
            static String shout() { return title.toUpperCase(); }
        }
      options:
        - "Eine `static`-Methode hat kein „aktuelles Buch“, also ist unklar, wessen `title` gemeint ist."
        - "`toUpperCase` darf man in `static`-Methoden nicht verwenden."
        - "`title` müsste `private` sein."
        - "`static`-Methoden dürfen nichts zurückgeben."
      answer: 0
      explanation: |
        Felder ohne `static` gibt es einmal **pro Objekt**. Eine `static`-Methode läuft ohne Objekt, also gibt es
        kein `title`, das sie lesen könnte.

- id: fundament-objekte-npe
  unit: fundament/klassen-objekte
  main:
    kind: single
    prompt: "Was passiert beim Ausführen?"
    code: |
      Book b = null;
      System.out.println(b.isThick());
    options:
      - "`NullPointerException` zur Laufzeit"
      - "Kompilierfehler"
      - "Ausgabe `false`"
      - "Ausgabe `null`"
    answer: 0
    explanation: |
      Der Code kompiliert (`b` hat den Typ `Book`, und `Book` hat `isThick()`). Zur Laufzeit zeigt `b` aber auf
      nichts – ein Methodenaufruf auf `null` wirft eine `NullPointerException`.

- id: fundament-konstruktor-erkennen
  unit: fundament/konstruktoren
  main:
    kind: single
    prompt: "Welche Zeile ist ein Konstruktor der Klasse `Book`?"
    options:
      - "`public Book(String title) { … }`"
      - "`public void Book(String title) { … }`"
      - "`public Book create(String title) { … }`"
      - "`public static Book(String title) { … }`"
    answer: 0
    explanation: |
      Ein Konstruktor heißt genau wie die Klasse und hat **keinen** Rückgabetyp – nicht einmal `void`.
      `public void Book(…)` ist eine (verwirrend benannte) normale Methode.

- id: fundament-konstruktor-this
  unit: fundament/konstruktoren
  main:
    kind: single
    prompt: "Was gibt `new Book(\"Der Hobbit\").getTitle()` zurück?"
    code: |
      public class Book {
          private String title;

          public Book(String title) {
              title = title;
          }

          public String getTitle() {
              return title;
          }
      }
    options:
      - "`null`"
      - "`\"Der Hobbit\"`"
      - "Kompilierfehler"
      - "Leerer String"
    answer: 0
    explanation: |
      Im Konstruktor meint `title` den **Parameter**. `title = title` weist den Parameter sich selbst zu, das Feld
      bleibt `null`. Richtig: `this.title = title;`.
  followUps:
    - kind: template
      prompt: "Ergänze den Konstruktor so, dass ein Buch immer gültig ist."
      template: |
        public class Book {
            {{private}} String title;
            {{private}} int pages;

            public {{Book(String title, int pages)}} {
                if (pages <= 0) {
                    throw new {{IllegalArgumentException}}("pages must be positive");
                }
                {{this.title = title;}}
                {{this.pages = pages;}}
            }
        }
      redHerrings:
        - "void Book(String title, int pages)"
        - "title = title;"
        - "public"
      reusable:
        - "private"
      explanation: |
        Felder `private`, Konstruktor ohne Rückgabetyp, zuerst prüfen, dann mit `this.` zuweisen.

- id: fundament-konstruktor-default
  unit: fundament/konstruktoren
  main:
    kind: single
    prompt: "Warum kompiliert `new Book()` nicht mehr?"
    code: |
      public class Book {
          private String title;

          public Book(String title) {
              this.title = title;
          }
      }

      Book b = new Book();
    options:
      - "Sobald es einen eigenen Konstruktor gibt, erzeugt Java keinen leeren `Book()` mehr."
      - "Weil `title` `private` ist."
      - "Weil Konstruktoren immer Parameter brauchen."
      - "Weil `Book` keinen Getter hat."
    answer: 0
    explanation: |
      Den leeren Standardkonstruktor gibt es nur, solange du **keinen** eigenen schreibst. JPA braucht ihn aber –
      darum steht an jedem Entity `@NoArgsConstructor(access = AccessLevel.PROTECTED)`.

- id: fundament-interface-implements
  unit: fundament/interfaces
  main:
    kind: single
    prompt: "Warum kompiliert `CheapPolicy` nicht?"
    code: |
      public interface LateFeePolicy {
          int feeInCents(int daysLate);
          String name();
      }

      public class CheapPolicy implements LateFeePolicy {
          @Override
          public int feeInCents(int daysLate) {
              return daysLate * 10;
          }
      }
    options:
      - "`name()` fehlt – wer ein Interface implementiert, muss alle seine Methoden ausprogrammieren."
      - "Ein Interface darf nur eine Methode haben."
      - "Es müsste `extends LateFeePolicy` heißen."
      - "`@Override` ist bei Interfaces verboten."
    answer: 0
    explanation: |
      `implements` heißt: Ich halte den ganzen Vertrag. Fehlt eine Methode, meldet der Compiler
      *CheapPolicy is not abstract and does not override abstract method name()*.

- id: fundament-interface-new
  unit: fundament/interfaces
  main:
    kind: multi
    prompt: "Welche Zeilen kompilieren? (`LateFeePolicy` ist ein Interface, `StandardPolicy implements LateFeePolicy`.)"
    options:
      - "`LateFeePolicy p = new StandardPolicy();`"
      - "`LateFeePolicy p = new LateFeePolicy();`"
      - "`List<String> names = new ArrayList<>();`"
      - "`StandardPolicy s = new LateFeePolicy();`"
    answer: [0, 2]
    explanation: |
      Links darf das Interface stehen, rechts muss eine **konkrete** Klasse mit `new` gebaut werden.
      Ein Interface allein hat keinen Code und lässt sich nicht erzeugen.

- id: fundament-interface-repository
  unit: fundament/interfaces
  main:
    kind: single
    prompt: "Wer schreibt den Code für die Methoden von `BookRepository`?"
    code: |
      public interface BookRepository extends JpaRepository<Book, Long> {
          List<Book> findByTitleContaining(String part);
      }
    options:
      - "Spring Data – es erzeugt beim Start automatisch eine Klasse, die das Interface implementiert."
      - "Du musst eine Klasse `BookRepositoryImpl` schreiben."
      - "Niemand – der Aufruf wirft immer eine Exception."
      - "Hibernate liest dafür eine XML-Datei."
    answer: 0
    explanation: |
      Das ist der Trick von Spring Data: Du schreibst nur den Vertrag (das Interface), Spring baut die Implementierung
      selbst – auch für `findBy…`-Methoden, aus deren Namen.

- id: fundament-override-tippfehler
  unit: fundament/override
  main:
    kind: single
    prompt: "Was passiert, wenn du hier `@Override` darüber schreibst?"
    code: |
      public class Book {
          private String title;

          public String toSting() {
              return "Book " + title;
          }
      }
    options:
      - "Kompilierfehler: Die Methode überschreibt nichts – so fällt der Tippfehler sofort auf."
      - "Nichts, `@Override` ist nur ein Kommentar."
      - "Java korrigiert den Namen automatisch zu `toString`."
      - "Laufzeitfehler beim Aufruf."
    answer: 0
    explanation: |
      `@Override` lässt den Compiler prüfen, dass es die Methode in einem Obertyp gibt. `toSting` gibt es nicht –
      ohne `@Override` wäre das eine neue Methode, und `System.out.println(book)` würde weiterhin `Book@1b6d3586`
      ausgeben.

- id: fundament-override-equals
  unit: fundament/override
  main:
    kind: single
    prompt: "Welche Signatur überschreibt `equals` von `Object` wirklich?"
    options:
      - "`public boolean equals(Object o)`"
      - "`public boolean equals(Book other)`"
      - "`public boolean equals(Book a, Book b)`"
      - "`public static boolean equals(Object o)`"
    answer: 0
    explanation: |
      Überschreiben verlangt **dieselbe Signatur**: Name, Parametertypen, Rückgabetyp. `equals(Book other)` ist eine
      zusätzliche Methode (überladen) – Collections und JPA rufen sie nie auf. `@Override` deckt so etwas auf.

- id: fundament-override-polymorphie
  unit: fundament/override
  main:
    kind: single
    prompt: "Was gibt der Code aus?"
    code: |
      // StandardPolicy: daysLate * 50
      // StudentPolicy:  Math.max(0, daysLate - 3) * 20
      LateFeePolicy policy = new StudentPolicy();
      System.out.println(policy.feeInCents(4));
    options:
      - "20"
      - "200"
      - "80"
      - "Kompilierfehler, weil `policy` den Typ `LateFeePolicy` hat"
    answer: 0
    explanation: |
      Es läuft die Methode des **echten Objekts** (`StudentPolicy`): `max(0, 4 - 3) * 20 = 20`.
      Der Typ der Variable bestimmt nur, welche Methoden du aufrufen darfst.

- id: fundament-vererbung-super
  unit: fundament/vererbung
  main:
    kind: single
    prompt: "Warum kompiliert der Konstruktor von `Ebook` nicht?"
    code: |
      public class Medium {
          private final String title;
          public Medium(String title) { this.title = title; }
      }

      public class Ebook extends Medium {
          private final double sizeMb;
          public Ebook(String title, double sizeMb) {
              this.sizeMb = sizeMb;
          }
      }
    options:
      - "`super(title);` fehlt – `Medium` hat keinen leeren Konstruktor, also muss `Ebook` den vorhandenen aufrufen."
      - "`sizeMb` darf nicht `final` sein."
      - "Unterklassen dürfen keine eigenen Felder haben."
      - "`Ebook` müsste `implements Medium` heißen."
    answer: 0
    explanation: |
      Jeder Konstruktor ruft zuerst einen Konstruktor der Oberklasse auf. Schreibst du nichts, versucht Java `super()` –
      den gibt es in `Medium` aber nicht. Also: `super(title);` als **erste** Zeile.
  followUps:
    - kind: single
      prompt: "`Ebook extends Medium`, `Medium` hat ein `private String title`. Was geht in einer Methode von `Ebook`?"
      options:
        - "`getTitle()` aufrufen"
        - "`title` direkt lesen"
        - "`this.title = \"x\"` setzen"
        - "`super.title` lesen"
      answer: 0
      explanation: |
        `private` heißt: nur in **dieser** Klasse sichtbar – auch Unterklassen sehen das Feld nicht. Geerbt wird aber der
        öffentliche Getter.

- id: fundament-vererbung-abstract
  unit: fundament/vererbung
  main:
    kind: multi
    prompt: "Was stimmt für `public abstract class Medium` mit der Methode `public abstract int loanDays();`?"
    options:
      - "`new Medium(\"x\")` kompiliert nicht."
      - "Jede nicht-abstrakte Unterklasse muss `loanDays()` ausprogrammieren."
      - "`Medium` darf trotzdem Felder und fertige Methoden haben."
      - "`Medium` darf keinen Konstruktor haben."
    answer: [0, 1, 2]
    explanation: |
      Eine abstrakte Klasse ist halb fertig: nicht direkt erzeugbar, darf aber Felder, Konstruktoren (für `super(…)`) und
      fertigen Code haben. Abstrakte Methoden muss jede konkrete Unterklasse liefern.

- id: fundament-equals-string
  unit: fundament/equals-hashcode
  main:
    kind: single
    prompt: "Wie prüfst du richtig, ob der Titel „Momo“ ist?"
    options:
      - "`\"Momo\".equals(book.getTitle())`"
      - "`book.getTitle() == \"Momo\"`"
      - "`book.getTitle() = \"Momo\"`"
      - "`book.getTitle().hashCode() == 0`"
    answer: 0
    explanation: |
      Strings sind Objekte: `==` vergleicht, ob es **dasselbe** Objekt ist, und das ist oft nicht der Fall, obwohl der
      Text gleich ist. `equals` vergleicht den Inhalt. `"Momo".equals(…)` hat den Bonus, dass es bei `null` einfach
      `false` liefert statt einer `NullPointerException`.

- id: fundament-equals-hashset
  unit: fundament/equals-hashcode
  main:
    kind: single
    prompt: "`Isbn` überschreibt nur `equals`, nicht `hashCode`. Was gibt der Code höchstwahrscheinlich aus?"
    code: |
      Set<Isbn> seen = new HashSet<>();
      seen.add(new Isbn("9783608938289"));
      System.out.println(seen.contains(new Isbn("9783608938289")));
    options:
      - "`false` – das HashSet sucht über `hashCode` in der falschen Schublade."
      - "`true` – `equals` reicht."
      - "Kompilierfehler"
      - "`NullPointerException`"
    answer: 0
    explanation: |
      Gleiche Objekte müssen den gleichen `hashCode` haben. Ohne eigenes `hashCode` bekommen die zwei ISBNs fast sicher
      verschiedene Werte, und `contains` vergleicht gar nicht erst mit `equals`. Darum: immer **beide** überschreiben –
      oder gleich einen `record` nehmen.

- id: fundament-list-map-basics
  unit: fundament/list-map
  main:
    kind: single
    prompt: "Was gibt der Code aus?"
    code: |
      Map<String, Integer> loans = new HashMap<>();
      loans.put("Mitte", 12);
      loans.put("Nord", 5);
      loans.put("Mitte", 13);
      System.out.println(loans.size() + " " + loans.get("Mitte") + " " + loans.get("Süd"));
    options:
      - "`2 13 null`"
      - "`3 12 null`"
      - "`3 13 0`"
      - "`2 25 0`"
    answer: 0
    explanation: |
      Ein Schlüssel kommt in einer Map nur **einmal** vor: Das zweite `put("Mitte", …)` überschreibt den Wert.
      Für einen fehlenden Schlüssel liefert `get` `null` – mit `getOrDefault("Süd", 0)` bekämst du `0`.
  followUps:
    - kind: single
      prompt: "Was passiert in der zweiten Zeile?"
      code: |
        List<String> titles = List.of("Momo", "Der Hobbit");
        titles.add("Krabat");
      options:
        - "`UnsupportedOperationException` – `List.of` ist unveränderlich."
        - "Die Liste hat danach drei Einträge."
        - "Kompilierfehler"
        - "Nichts, `add` wird ignoriert."
      answer: 0
      explanation: |
        `List.of(…)` liefert eine unveränderliche Liste. Zum Befüllen nimm `new ArrayList<>()`, oder kopiere:
        `new ArrayList<>(List.of(…))`.

- id: fundament-list-map-index
  unit: fundament/list-map
  main:
    kind: single
    prompt: "`titles` enthält `[\"Momo\", \"Der Hobbit\", \"Krabat\"]`. Was liefert `titles.get(1)`?"
    options:
      - "`\"Der Hobbit\"`"
      - "`\"Momo\"`"
      - "`\"Krabat\"`"
      - "`IndexOutOfBoundsException`"
    answer: 0
    explanation: |
      Der Index beginnt bei **0**: `get(0)` ist „Momo“, `get(1)` „Der Hobbit“, `get(2)` „Krabat“. `get(3)` würde eine
      `IndexOutOfBoundsException` werfen.

- id: fundament-generics-repository
  unit: fundament/generics
  main:
    kind: single
    prompt: "Das Entity `Book` erbt von `AbstractPersistable<Long>`. Welche Zeile ist richtig?"
    options:
      - "`interface BookRepository extends JpaRepository<Book, Long>`"
      - "`interface BookRepository extends JpaRepository<Long, Book>`"
      - "`interface BookRepository extends JpaRepository<Book, long>`"
      - "`class BookRepository implements JpaRepository<Book>`"
    answer: 0
    explanation: |
      Zuerst das Entity, dann der Typ der Id. In spitzen Klammern dürfen keine primitiven Typen stehen, also `Long` statt
      `long`. Und das Repository ist ein **Interface**, das Spring Data implementiert.
  followUps:
    - kind: template
      prompt: "Ergänze die Typen."
      template: |
        public class GenreConverter implements AttributeConverter<{{Genre}}, {{String}}> { … }

        Optional<{{Book}}> found = repository.findById(42L);
        List<{{Integer}}> pages = new ArrayList<{{}}>();
        ResponseEntity<{{Void}}> deleted = ResponseEntity.noContent().build();
      redHerrings:
        - "int"
        - "void"
        - "Optional"
      explanation: |
        `AttributeConverter<JavaTyp, DbTyp>`, `findById` liefert `Optional<Entity>`, Listen brauchen den Wrapper
        `Integer`, rechts reicht der Diamant `<>`, und eine Antwort ohne Body ist `ResponseEntity<Void>` mit großem V.

- id: fundament-exceptions-flow
  unit: fundament/exceptions
  main:
    kind: single
    prompt: "Was gibt der Code aus, wenn das Buch schon verliehen ist und `borrow` dann eine `IllegalStateException` wirft?"
    code: |
      try {
          library.borrow(book);
          System.out.println("A");
      } catch (IllegalStateException e) {
          System.out.println("B");
      }
      System.out.println("C");
    options:
      - "`B` und `C`"
      - "`A`, `B` und `C`"
      - "nur `B`"
      - "`A` und `C`"
    answer: 0
    explanation: |
      Die Exception bricht den `try`-Block sofort ab – `A` wird nicht mehr ausgegeben. Der passende `catch`-Block läuft,
      danach geht es normal weiter mit `C`.

- id: fundament-exceptions-own
  unit: fundament/exceptions
  main:
    kind: template
    prompt: "Baue eine eigene, unchecked Exception für ein fehlendes Buch."
    template: |
      public class BookNotFoundException {{extends RuntimeException}} {
          public BookNotFoundException(long id) {
              {{super("Book " + id + " not found");}}
          }
      }
    redHerrings:
      - "extends Exception"
      - "implements RuntimeException"
      - "return \"Book \" + id + \" not found\";"
    explanation: |
      Unchecked heißt `extends RuntimeException` – dann verlangt der Compiler kein `throws`. Die Nachricht gibst du mit
      `super(…)` an die Oberklasse weiter; `getMessage()` liefert sie später.
  followUps:
    - kind: single
      prompt: "Welche eingebaute Exception passt, wenn `pages` beim Anlegen eines Buches negativ ist?"
      options:
        - "`IllegalArgumentException`"
        - "`IllegalStateException`"
        - "`NullPointerException`"
        - "`IOException`"
      answer: 0
      explanation: |
        Ein **Parameter** ist ungültig → `IllegalArgumentException`. `IllegalStateException` ist für einen falschen
        **Zustand** (z. B. Buch schon verliehen).

- id: fundament-annotationen-wer
  unit: fundament/annotationen
  main:
    kind: single
    prompt: "Du hast `@Entity` an `Book` vergessen. Was passiert?"
    options:
      - "Der Code kompiliert, aber Hibernate legt keine Tabelle an – der Fehler zeigt sich erst beim Start oder im Test."
      - "Der Compiler meldet sofort einen Fehler."
      - "Nichts, `@Entity` ist optional."
      - "IntelliJ ergänzt die Annotation beim Kompilieren automatisch."
    answer: 0
    explanation: |
      Annotationen sind Zettel, die ein Werkzeug liest. `@Entity` liest Hibernate – der Compiler kümmert sich nicht darum.
      Darum kompiliert der Code, und z. B. das Repository scheitert erst beim Start mit *Not a managed type: class Book*.
  followUps:
    - kind: single
      prompt: "Welcher Import gehört zu `@Test` in der Matura?"
      options:
        - "`org.junit.jupiter.api.Test`"
        - "`org.junit.Test`"
        - "`org.springframework.boot.test.Test`"
        - "`jakarta.persistence.Test`"
      answer: 0
      explanation: |
        JUnit 5 (Jupiter) liegt in `org.junit.jupiter.api`. `org.junit.Test` ist JUnit 4 – damit werden deine Tests im
        Seed-Projekt nicht gefunden.

- id: fundament-spring-di-constructor
  unit: fundament/spring-di
  main:
    kind: single
    prompt: "Wie bekommt `BookController` sein `BookService`?"
    code: |
      @RestController
      @RequiredArgsConstructor
      public class BookController {
          private final BookService service;
      }
    options:
      - "Spring baut beim Start ein `BookService` (eine Bean) und übergibt es dem Konstruktor, den Lombok erzeugt."
      - "Gar nicht – `service` bleibt `null`, man muss `new BookService()` schreiben."
      - "Über eine statische Methode `BookService.getInstance()`."
      - "Hibernate lädt es aus der Datenbank."
    answer: 0
    explanation: |
      Das ist Dependency Injection: `@RequiredArgsConstructor` erzeugt einen Konstruktor für alle `final`-Felder, und
      Spring ruft ihn mit der passenden Bean auf. Selbst `new` zu schreiben würde die Austauschbarkeit im Test zerstören.
  followUps:
    - kind: single
      prompt: "Beim Start: *required a bean of type 'BookService' that could not be found*. Was ist die wahrscheinlichste Ursache?"
      options:
        - "An der Klasse `BookService` fehlt `@Service`."
        - "`BookController` hat kein `@GetMapping`."
        - "Die Datenbank ist leer."
        - "`service` ist `final`."
      answer: 0
      explanation: |
        Spring baut nur Beans aus Klassen mit `@Service`, `@Repository`, `@Component`, `@RestController` … Fehlt die
        Annotation, gibt es nichts zu übergeben.

- id: fundament-spring-di-why
  unit: fundament/spring-di
  main:
    kind: multi
    prompt: "Welche Aussagen über Dependency Injection stimmen?"
    options:
      - "Eine Klasse baut ihre Abhängigkeiten nicht selbst, sie bekommt sie von außen."
      - "Im Test kann man statt der echten Abhängigkeit einen Mock übergeben."
      - "DI funktioniert nur mit Datenbanken."
      - "In Spring ist der Konstruktor der übliche Weg, Abhängigkeiten zu bekommen."
    answer: [0, 1, 3]
    explanation: |
      Genau das sind die Punkte für die Theoriefrage: Abhängigkeit kommt von außen (Container = Spring), Konstruktor-
      Injection, Austauschbarkeit (Mock im Test, andere Implementierung im Betrieb). Mit Datenbanken hat DI nichts zu tun.
