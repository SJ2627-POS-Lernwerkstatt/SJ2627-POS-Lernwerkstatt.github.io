name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # PlantUML diagrams are rendered at build time (scripts/markdown/plantuml.ts).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: sudo apt-get install -y --no-install-recommends graphviz
      - name: Download PlantUML
        run: |
          curl -sSfL -o "$RUNNER_TEMP/plantuml.jar" \
            "https://github.com/plantuml/plantuml/releases/download/v${PLANTUML_VERSION}/plantuml-${PLANTUML_VERSION}.jar"
          echo "PLANTUML_JAR=$RUNNER_TEMP/plantuml.jar" >> "$GITHUB_ENV"
        env:
          PLANTUML_VERSION: 1.2026.8
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/plantuml
          key: plantuml-${{ hashFiles('src/content/**/*.md') }}
          restore-keys: plantuml-
      - run: npm run check
      - run: npm test
      - run: npm run build
      # Smoke test against the prerendered site (unit page, Wissenscheck, exercise run, exercise page).
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
